/* --- 履歴・保存 --- */
function dSnap(){DRW.undo.push(JSON.stringify(DRW.items));if(DRW.undo.length>100)DRW.undo.shift();DRW.redo=[];}
function dChanged(){DRW.sel=[];dDraw();dSync();dSave();}
function dUndo(){if(!DRW.undo.length)return toast('これ以上戻せません');DRW.redo.push(JSON.stringify(DRW.items));DRW.items=JSON.parse(DRW.undo.pop());dChanged();}
function dRedo(){if(!DRW.redo.length)return;DRW.undo.push(JSON.stringify(DRW.items));DRW.items=JSON.parse(DRW.redo.pop());dChanged();}
function dSave(){clearTimeout(DRW.saveT);DRW.saveT=setTimeout(dFlush,400);}
function dStorePage(){const pg=DRW.pages[DRW.pi];if(pg){pg.paper=DRW.paper;pg.items=DRW.items;}}
async function dFlush(){
  clearTimeout(DRW.saveT);if(!DRW.siteId)return;dStorePage();
  const used=new Set();DRW.pages.forEach(pg=>pg.items.forEach(it=>{if(it.t==='img')used.add(it.id);}));
  const imgs={};used.forEach(id=>{if(DRW.imgs[id])imgs[id]=DRW.imgs[id].src;});
  try{await DB.set('dr:'+DRW.siteId,{pages:DRW.pages,pi:DRW.pi,imgs});}catch(e){console.warn(e);toast('下書きを保存できませんでした（容量不足の可能性）');}
}
function dLoadPage(i){
  DRW.pi=Math.max(0,Math.min(i,DRW.pages.length-1));const pg=DRW.pages[DRW.pi];
  DRW.paper=pg.paper;DRW.items=pg.items;DRW.sel=[];DRW.undo=[];DRW.redo=[];DRW.cur=null;dSync();dFit();
}
/* --- 消しゴム用の当たり判定 --- */
function dSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));
}
function dHit(it,m,r){
  const q=r+(it.w||0)/2;
  if(it.t==='pen'){
    const P=it.pts;if(P.length===1)return Math.hypot(m.x-P[0][0],m.y-P[0][1])<=q;
    for(let i=1;i<P.length;i++)if(dSeg(m.x,m.y,P[i-1][0],P[i-1][1],P[i][0],P[i][1])<=q)return true;return false;
  }
  if(it.t==='img')return m.x>=it.a.x&&m.x<=it.b.x&&m.y>=it.a.y&&m.y<=it.b.y;
  if(it.t==='line')return dSeg(m.x,m.y,it.a.x,it.a.y,it.b.x,it.b.y)<=q;
  if(it.t==='rect'){
    const x0=Math.min(it.a.x,it.b.x),x1=Math.max(it.a.x,it.b.x),y0=Math.min(it.a.y,it.b.y),y1=Math.max(it.a.y,it.b.y);
    return dSeg(m.x,m.y,x0,y0,x1,y0)<=q||dSeg(m.x,m.y,x1,y0,x1,y1)<=q||dSeg(m.x,m.y,x1,y1,x0,y1)<=q||dSeg(m.x,m.y,x0,y1,x0,y0)<=q;
  }
  if(it.t==='text'){const w=dTextW(it);return m.x>=it.x-q&&m.x<=it.x+w+q&&m.y>=it.y-it.size-q&&m.y<=it.y+it.size*0.3+q;}
  return false;
}
// 消しゴム：消しゴムの円に重なる部分だけを切り取り、残りは別の線として残す
function dCut(it,m,r){
  let P;
  if(it.t==='pen')P=it.pts;
  else if(it.t==='line')P=[[it.a.x,it.a.y],[it.b.x,it.b.y]];
  else if(it.t==='rect'){const x0=Math.min(it.a.x,it.b.x),x1=Math.max(it.a.x,it.b.x),y0=Math.min(it.a.y,it.b.y),y1=Math.max(it.a.y,it.b.y);P=[[x0,y0],[x1,y0],[x1,y1],[x0,y1],[x0,y0]];}
  else return null;
  if(P.length===1)return Math.hypot(m.x-P[0][0],m.y-P[0][1])<=r+it.w/2?[]:null;
  let touched=false;
  for(let i=1;i<P.length&&!touched;i++)if(dSeg(m.x,m.y,P[i-1][0],P[i-1][1],P[i][0],P[i][1])<=r)touched=true;
  if(!touched)return null;
  const out=[];let cur=Math.hypot(P[0][0]-m.x,P[0][1]-m.y)<r?[]:[P[0].slice()];
  for(let i=1;i<P.length;i++){
    const A=P[i-1],B=P[i],dx=B[0]-A[0],dy=B[1]-A[1],fx=A[0]-m.x,fy=A[1]-m.y;
    const a=dx*dx+dy*dy,b=2*(fx*dx+fy*dy),c=fx*fx+fy*fy-r*r;
    let t1=1,t2=0,hit=false;
    if(a>1e-12){const disc=b*b-4*a*c;if(disc>0){const sq=Math.sqrt(disc);t1=(-b-sq)/(2*a);t2=(-b+sq)/(2*a);hit=t1<1&&t2>0;}}
    if(!hit){if(cur.length)cur.push(B.slice());else cur=[A.slice(),B.slice()];continue;}
    if(t1>0){cur.push([A[0]+dx*t1,A[1]+dy*t1]);}
    if(cur.length>=2)out.push(cur);
    cur=[];
    if(t2<1)cur=[[A[0]+dx*t2,A[1]+dy*t2],B.slice()];
  }
  if(cur.length>=2)out.push(cur);
  return out.map(pts=>({t:'pen',c:it.c,w:it.w,d:it.d,pts}));
}
function dErase(m,c){
  const r=Math.max(1.5,9/DRW.view.s);let hit=false;
  for(let i=DRW.items.length-1;i>=0;i--){
    const it=DRW.items[i];let res=null;
    if(it.t==='text')res=dHit(it,m,r)?[]:null;else res=dCut(it,m,r);
    if(res===null)continue;
    if(!c.snapped){dSnap();c.snapped=true;}
    DRW.items.splice(i,1,...res);hit=true;
  }
  return hit;
}
// 直線の終点：Shift（またはタッチ・ペンで、ほぼ水平垂直のとき）で水平・垂直に固定
function dOrtho(a,m,shift,auto){
  const dx=m.x-a.x,dy=m.y-a.y;if(Math.hypot(dx,dy)<1e-6)return m;
  const horiz=Math.abs(dx)>=Math.abs(dy),along=horiz?Math.abs(dx):Math.abs(dy),off=horiz?Math.abs(dy):Math.abs(dx);
  const near=Math.atan2(off,along)<0.087||off*DRW.view.s<8;
  if(shift||(DRW.auto&&Math.atan2(off,along)<0.44)||(auto&&S.orthoAuto&&near))return{x:horiz?m.x:a.x,y:horiz?a.y:m.y};
  return m;
}

/* --- ポインタ操作（ペン・マウス＝描く／指＝拡大移動、「指で描く」ONなら指も描く） --- */
function dGestInit(){
  const a=[...DRW.ptrs.values()];
  if(a.length>=2){const[p,q]=a;DRW.gest={k:'pz',d:Math.hypot(p.x-q.x,p.y-q.y)||1,mx:(p.x+q.x)/2,my:(p.y+q.y)/2,v:{...DRW.view}};}
  else if(a.length===1)DRW.gest={k:'pan',x:a[0].x,y:a[0].y,v:{...DRW.view}};
  else DRW.gest=null;
}
function dGestMove(){
  const g=DRW.gest;if(!g)return;const a=[...DRW.ptrs.values()],v=g.v;
  if(g.k==='pz'&&a.length>=2){
    const[p,q]=a,d=Math.hypot(p.x-q.x,p.y-q.y)||1,mx=(p.x+q.x)/2,my=(p.y+q.y)/2;
    const s=Math.min(30,Math.max(0.3,v.s*d/g.d)),f=s/v.s;
    DRW.view={s,tx:mx-(g.mx-v.tx)*f,ty:my-(g.my-v.ty)*f};
  }else if(g.k==='pan'&&a.length===1){
    DRW.view={s:v.s,tx:v.tx+a[0].x-g.x,ty:v.ty+a[0].y-g.y};
  }
  dDraw();
}
function dStart(e,p){
  const m=dMM(p),t=DRW.tool;
  if(t==='text'){dAddText(m);return;}
  const meta={pid:e.pointerId,pType:e.pointerType,last:p};
  if(t==='sel'){
    if(DRW.sel.length){const r=Math.max(1.5,9/DRW.view.s);if(DRW.sel.some(it=>dInBox(it,m,r))){DRW.cur={t:'mv',lm:m,snapped:false,...meta};return;}}
    DRW.sel=[];DRW.cur={t:'sel',a:m,b:m,...meta};dSync();dDraw();return;
  }
  if(t==='erase'){DRW.cur={t:'erase',snapped:false,lm:m,...meta};if(dErase(m,DRW.cur))dChanged();return;}
  const base={c:DRW.color,w:DRW.w,d:DRW.dash};
  DRW.cur=t==='pen'?{...base,t:'pen',pts:[[m.x,m.y]],...meta}:{...base,t,a:m,b:m,...meta};
  dDraw();
}
function dMove(e,p){
  const c=DRW.cur;c.last=p;
  if(c.t==='mv'){const m=dMM(p),dx=m.x-c.lm.x,dy=m.y-c.lm.y;if(!c.snapped){dSnap();c.snapped=true;}for(const it of DRW.sel)dShift(it,dx,dy);c.lm=m;dDraw();return;}
  if(c.t==='erase'){const m=dMM(p),L=c.lm||m,step=Math.max(1,Math.max(1.5,9/DRW.view.s)*0.7),n=Math.max(1,Math.ceil(Math.hypot(m.x-L.x,m.y-L.y)/step));let h=false;for(let k=1;k<=n;k++)h=dErase({x:L.x+(m.x-L.x)*k/n,y:L.y+(m.y-L.y)*k/n},c)||h;c.lm=m;if(h)dChanged();return;}
  if(c.t==='pen'){
    const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];const list=evs.length?evs:[e],minD=1.2/DRW.view.s;
    for(const ev of list){
      const m=dMM(dPos(ev)),l=c.pts[c.pts.length-1];
      if(Math.hypot(m.x-l[0],m.y-l[1])>=minD)c.pts.push([m.x,m.y]);
    }
  }else{
    const m=dMM(p);
    c.b=c.t==='line'?dOrtho(c.a,m,e.shiftKey,e.pointerType!=='mouse'):m;
  }
  dDraw();
}
/* --- 手書き線の自動直線化（v2）
   折れ点抽出(RDP) → 短い引っかかり・角の丸み除去 → 区間ごとに水平/垂直/斜めを判定し同じ向きの連続区間を統合
   → 各区間の元の点群に直線を当てはめ → 隣り合う直線の交点を角にする（角が斜めに欠けたりZ字に折れない） --- */
function dRdpI(P,i0,i1,eps,out){
  let md=-1,mi=-1;const a=P[i0],b=P[i1];
  for(let i=i0+1;i<i1;i++){const d=dSeg(P[i][0],P[i][1],a[0],a[1],b[0],b[1]);if(d>md){md=d;mi=i;}}
  if(mi>0&&md>eps){dRdpI(P,i0,mi,eps,out);dRdpI(P,mi,i1,eps,out);}else out.push(i1);
}
function dRdp(P,eps){if(P.length<3)return P.slice();const o=[0];dRdpI(P,0,P.length-1,eps,o);return o.map(i=>P[i]);}
function dStraight(pts){
  const N=pts.length;if(N<3)return pts;
  let len=0;for(let i=1;i<N;i++)len+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  if(len<4)return pts;
  const sc=DRW.view.s,eps=Math.max(1.5,10/sc),minL=Math.max(3,22/sc);
  const D=(i,j)=>Math.hypot(pts[j][0]-pts[i][0],pts[j][1]-pts[i][1]);
  const ang=(i,j)=>Math.atan2(pts[j][1]-pts[i][1],pts[j][0]-pts[i][0]);
  const TH=25*Math.PI/180;
  const cls=(i,j)=>{let a=Math.abs(ang(i,j))%Math.PI;if(a>Math.PI/2)a=Math.PI-a;return a<=TH?'H':(Math.PI/2-a)<=TH?'V':'F';};
  let I=[0];dRdpI(pts,0,N-1,eps,I);
  // 1) 短い区間を除去（書き始め・書き終わりの引っかかり、角の丸み・Z字の折り返し）
  for(let g=0,ch=true;ch&&I.length>2&&g<200;g++){
    ch=false;const n=I.length-1;
    if(D(I[0],I[1])<minL){I.shift();ch=true;continue;}
    if(D(I[n-1],I[n])<minL){I.pop();ch=true;continue;}
    let mk=-1,ml=1e9;
    for(let k=1;k<n-1;k++){const l=D(I[k],I[k+1]);if(l<minL&&l<ml){ml=l;mk=k;}}
    if(mk>0){I.splice(mk,2,Math.round((I[mk]+I[mk+1])/2));ch=true;}
  }
  // 1.5) 水平⇔垂直の角にできた短い斜め（角の丸み）を除去
  for(let ch=true;ch&&I.length>2;){
    ch=false;const n=I.length-1;
    for(let k=0;k<n;k++){
      if(cls(I[k],I[k+1])!=='F')continue;const l=D(I[k],I[k+1]);
      const pc=k>0?cls(I[k-1],I[k]):null,nc=k<n-1?cls(I[k+1],I[k+2]):null;
      if(pc&&nc&&pc!=='F'&&nc!=='F'&&pc!==nc&&l<Math.max(3*minL,0.2*Math.min(D(I[k-1],I[k]),D(I[k+1],I[k+2])))){I.splice(k,2,Math.round((I[k]+I[k+1])/2));ch=true;break;}
      if(k===0&&nc&&nc!=='F'&&l<2*minL){I.shift();ch=true;break;}
      if(k===n-1&&pc&&pc!=='F'&&l<2*minL){I.pop();ch=true;break;}
    }
  }
  // 2) 同じ向き（水平同士・垂直同士・ほぼ同じ角度の斜め同士）の連続区間を1本に統合
  for(let ch=true;ch&&I.length>2;){
    ch=false;
    for(let k=1;k<I.length-1;k++){
      const c1=cls(I[k-1],I[k]),c2=cls(I[k],I[k+1]);
      let same=c1===c2&&c1!=='F';
      if(!same&&c1==='F'&&c2==='F'){let d=Math.abs(ang(I[k-1],I[k])-ang(I[k],I[k+1]))%(2*Math.PI);if(d>Math.PI)d=2*Math.PI-d;same=d<12*Math.PI/180;}
      if(same){I.splice(k,1);ch=true;break;}
    }
  }
  // 3) 区間ごとに直線を当てはめ（両端15%は角の丸みの影響を避けるため除外）
  const L=[];
  for(let k=0;k<I.length-1;k++){
    const i0=I[k],i1=I[k+1],c=cls(i0,i1),m=i1-i0,cut=m>=8?Math.floor(m*0.15):0;
    let sx=0,sy=0,n=0;for(let i=i0+cut;i<=i1-cut;i++){sx+=pts[i][0];sy+=pts[i][1];n++;}
    const cx=sx/n,cy=sy/n;let ux,uy;
    if(c==='H'){ux=Math.sign(pts[i1][0]-pts[i0][0])||1;uy=0;}
    else if(c==='V'){ux=0;uy=Math.sign(pts[i1][1]-pts[i0][1])||1;}
    else{
      let xx=0,yy=0,xy=0;for(let i=i0+cut;i<=i1-cut;i++){const dx=pts[i][0]-cx,dy=pts[i][1]-cy;xx+=dx*dx;yy+=dy*dy;xy+=dx*dy;}
      const t=0.5*Math.atan2(2*xy,xx-yy);ux=Math.cos(t);uy=Math.sin(t);
      if(ux*(pts[i1][0]-pts[i0][0])+uy*(pts[i1][1]-pts[i0][1])<0){ux=-ux;uy=-uy;}
    }
    L.push({cx,cy,ux,uy});
  }
  const proj=(l,p)=>{const t=(p[0]-l.cx)*l.ux+(p[1]-l.cy)*l.uy;return[l.cx+l.ux*t,l.cy+l.uy*t];};
  const inter=(a,b)=>{const d=a.ux*b.uy-a.uy*b.ux;if(Math.abs(d)<0.08)return null;const t=((b.cx-a.cx)*b.uy-(b.cy-a.cy)*b.ux)/d;return[a.cx+a.ux*t,a.cy+a.uy*t];};
  const closed=I.length>=4&&D(0,N-1)<Math.max(8,len*0.05);
  const out=[];
  out.push(closed?null:proj(L[0],pts[0]));
  for(let k=1;k<L.length;k++){
    const raw=pts[I[k]],q=inter(L[k-1],L[k]);
    const lim=Math.max(3*eps,0.5*Math.min(D(I[k-1],I[k]),D(I[k],I[k+1])));
    const hv=(L[k-1].uy===0&&L[k].ux===0)||(L[k-1].ux===0&&L[k].uy===0); // 水平と垂直の角は必ず交点で結ぶ
    if(q&&(hv||Math.hypot(q[0]-raw[0],q[1]-raw[1])<=lim))out.push(q);
    else{out.push(proj(L[k-1],raw));out.push(proj(L[k],raw));}
  }
  if(closed){
    const q=inter(L[L.length-1],L[0]);const c=q&&Math.hypot(q[0]-pts[0][0],q[1]-pts[0][1])<=Math.max(4*eps,len*0.08)?q:proj(L[0],pts[0]);
    out[0]=c;out.push([c[0],c[1]]);
  }else out.push(proj(L[L.length-1],pts[N-1]));
  return out.length>=2?out:pts;
}
function dInBox(it,m,pad){const b=dBox(it);return m.x>=b.x0-pad&&m.x<=b.x1+pad&&m.y>=b.y0-pad&&m.y<=b.y1+pad;}
function dShift(it,dx,dy){
  if(it.t==='pen')for(const q of it.pts){q[0]+=dx;q[1]+=dy;}
  else if(it.t==='text'){it.x+=dx;it.y+=dy;}
  else{it.a={x:it.a.x+dx,y:it.a.y+dy};it.b={x:it.b.x+dx,y:it.b.y+dy};}
}
function dBox(it){
  if(it.t==='pen'){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of it.pts){x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1]);}return{x0,y0,x1,y1};}
  if(it.t==='text')return{x0:it.x,y0:it.y-it.size,x1:it.x+dTextW(it),y1:it.y+it.size*0.3};
  return{x0:Math.min(it.a.x,it.b.x),y0:Math.min(it.a.y,it.b.y),x1:Math.max(it.a.x,it.b.x),y1:Math.max(it.a.y,it.b.y)};
}
function dSelect(c){
  const x0=Math.min(c.a.x,c.b.x),x1=Math.max(c.a.x,c.b.x),y0=Math.min(c.a.y,c.b.y),y1=Math.max(c.a.y,c.b.y);
  if(x1-x0<1&&y1-y0<1){ // タップ：一番上の図形を1つ選択
    const r=Math.max(1.5,9/DRW.view.s);DRW.sel=[];
    for(let i=DRW.items.length-1;i>=0;i--)if(dHit(DRW.items[i],c.a,r)){DRW.sel=[DRW.items[i]];break;}
  }else{ // 枠に触れた図形をすべて選択
    DRW.sel=DRW.items.filter(it=>{const b=dBox(it);return b.x1>=x0&&b.x0<=x1&&b.y1>=y0&&b.y0<=y1;});
  }
  dDraw();dSync();
}
function dDelSel(){
  if(!DRW.sel.length)return toast('削除する図形を範囲選択してください');
  const set=new Set(DRW.sel);dSnap();DRW.items=DRW.items.filter(it=>!set.has(it));dChanged();
}
function dEnd(){
  const c=DRW.cur;DRW.cur=null;if(!c)return;
  if(c.t==='erase'){dDraw();return;}
  if(c.t==='mv'){dDraw();dSave();return;}
  if(c.t==='sel'){dSelect(c);return;}
  let it;
  if(c.t==='pen')it={t:'pen',c:c.c,w:c.w,d:c.d,pts:DRW.auto?dStraight(c.pts):c.pts};
  else{
    if(Math.hypot(c.b.x-c.a.x,c.b.y-c.a.y)<0.8){dDraw();return;}
    it={t:c.t,c:c.c,w:c.w,d:c.d,a:c.a,b:c.b};
  }
  dSnap();DRW.items.push(it);dChanged();
}
async function dAddText(m){
  const s=await askText({title:'文字を入力',note:'図面に書き込む文字を入力してください（例：道路、隣地境界、建物、玄関）',value:''});
  closeModal();
  if(!s)return;
  if(s.length>60){toast('文字数が多すぎます（60文字まで）');return;}
  const size=DRW.size;
  dSnap();DRW.items.push({t:'text',c:DRW.color,size,x:m.x,y:m.y+size*0.35,s});dChanged();
}

dcv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button>1)return;
  e.preventDefault();
  const p=dPos(e);
  if(e.pointerType==='pen'){DRW.ptrs.clear();DRW.gest=null;}
  if(DRW.cur&&DRW.cur.pid!==e.pointerId){
    if(e.pointerType==='touch'&&DRW.cur.pType==='touch'){DRW.ptrs.set(DRW.cur.pid,DRW.cur.last);DRW.cur=null;} // 指で描き始めた直後に2本目 → 拡大移動へ
    else return; // ペンで描画中の手のひら接触などは無視
  }
  const drawable=DRW.tool!=='hand'&&e.button===0&&!DRW.ptrs.size&&(e.pointerType!=='touch'||S.finger);
  try{dcv.setPointerCapture(e.pointerId);}catch(_){}
  if(drawable){dStart(e,p);return;}
  if(e.pointerType==='touch'||e.button===1||DRW.tool==='hand'){DRW.ptrs.set(e.pointerId,p);dGestInit();}
});
dcv.addEventListener('pointermove',e=>{
  const p=dPos(e);
  if(DRW.cur&&DRW.cur.pid===e.pointerId){dMove(e,p);return;}
  if(DRW.ptrs.has(e.pointerId)){DRW.ptrs.set(e.pointerId,p);dGestMove();}
});
const dUp=e=>{
  if(DRW.cur&&DRW.cur.pid===e.pointerId){if(e.type==='pointercancel'){DRW.cur=null;dDraw();}else dEnd();return;}
  if(DRW.ptrs.has(e.pointerId)){DRW.ptrs.delete(e.pointerId);dGestInit();}
};
dcv.addEventListener('pointerup',dUp);dcv.addEventListener('pointercancel',dUp);
dcv.addEventListener('contextmenu',e=>e.preventDefault());
dcv.addEventListener('wheel',e=>{
  e.preventDefault();const p=dPos(e),v=DRW.view;
  const s=Math.min(30,Math.max(0.3,v.s*Math.exp(-e.deltaY*(e.ctrlKey?0.02:0.0025)))),k=s/v.s;
  DRW.view={s,tx:p.x-(p.x-v.tx)*k,ty:p.y-(p.y-v.ty)*k};dDraw();
},{passive:false});

/* --- PDF生成（線・四角はベクター、日本語の文字は透過PNGで貼る） --- */
function dTextPng(it){
  const K=12,c=document.createElement('canvas'),x=c.getContext('2d'),f=`${it.size*K}px ${DFONT}`;
  x.font=f;const w=Math.ceil(x.measureText(it.s).width)+8,h=Math.ceil(it.size*K*1.45);
  c.width=w;c.height=h;x.font=f;x.fillStyle=it.c;x.textBaseline='alphabetic';x.fillText(it.s,4,it.size*K*1.1);
  return{url:c.toDataURL('image/png'),w:w/K,h:h/K,ox:4/K,asc:it.size*1.1};
}
async function dMakePdf(){
  dStorePage();
  await loadJsPdf();const{jsPDF}=window.jspdf;let doc=null;
  DRW.pages.forEach(pg=>{
    const[PW,PH]=PAPERS[pg.paper]||PAPERS.a3l,fmt=pg.paper.startsWith('a3')?'a3':'a4',or=PW>=PH?'l':'p';
    if(!doc)doc=new jsPDF({orientation:or,unit:'mm',format:fmt});else doc.addPage(fmt,or);
    doc.setLineCap('round');doc.setLineJoin('round');
    for(const it of pg.items){
      if(it.t==='img'){const o=DRW.imgs[it.id];if(o)doc.addImage(o.src,'JPEG',it.a.x,it.a.y,it.b.x-it.a.x,it.b.y-it.a.y,it.id);continue;}
      if(it.t==='text'){const t=dTextPng(it);doc.addImage(t.url,'PNG',it.x-t.ox,it.y-t.asc,t.w,t.h);continue;}
      doc.setDrawColor(it.c);doc.setFillColor(it.c);doc.setLineWidth(it.w);
      if(it.d){const[a,b]=dDashOf(it);doc.setLineDashPattern([a,b],0);}else doc.setLineDashPattern([],0);
      if(it.t==='pen'){
        const P=it.pts;
        if(P.length<2){doc.setLineDashPattern([],0);doc.circle(P[0][0],P[0][1],it.w/2,'F');}
        else{const rel=[];for(let i=1;i<P.length;i++)rel.push([P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]]);doc.lines(rel,P[0][0],P[0][1],[1,1],'S',false);}
      }else if(it.t==='line'){
        doc.line(it.a.x,it.a.y,it.b.x,it.b.y);
      }else if(it.t==='rect'){
        doc.rect(Math.min(it.a.x,it.b.x),Math.min(it.a.y,it.b.y),Math.abs(it.b.x-it.a.x),Math.abs(it.b.y-it.a.y),'S');
      }
    }
    doc.setLineDashPattern([],0);
  });
  return doc.output('arraybuffer');
}
async function dMakePng(){
  dStorePage();const pg=DRW.pages[0],[PW,PH]=PAPERS[pg.paper]||PAPERS.a3l,k=3990/Math.max(PW,PH),c=document.createElement('canvas');
  c.width=Math.round(PW*k);c.height=Math.round(PH*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.scale(k,k);
  for(const it of pg.items)dPaint(x,it);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('画像を作成できません')),'image/png'));
}
// 地図を貼った下絵は、実寸の縮尺を自動設定（📏 縮尺 を手で設定しなくてよい）
function dApplyScales(base,pdf){
  let n=0;
  DRW.pages.forEach((pg,i)=>{
    const im=pg.items.find(it=>it.t==='img'&&it.gw>0);if(!im)return;
    const[PW,PH]=PAPERS[pg.paper]||PAPERS.a3l,k=pdf?Math.min(4000/Math.max(PW,PH),17):3990/Math.max(PW,PH),gm=im.gw/(im.b.x-im.a.x);
    S.scales[base+i]={a:{x:100*k,y:100*k},b:{x:200*k,y:100*k},mm:100*gm};n++;
  });
  if(n)refresh();return n;
}
async function dConvert(append){
  dStorePage();
  if(!DRW.pages.some(pg=>pg.items.length))return toast('先に手書きで図面を描いてください');
  append=!!append&&!!S.bg;
  if(!append&&(allPts().length||S.strokes.length)&&!confirm('この現場の図面を手書き図面に差し替えます。測点・手書きデータ・フロアは消去されます。\n（今の図面を残して追加するときは、キャンセルして「➕ 現在の図面に追加」を使います）\nよろしいですか？'))return;
  toast('PDFを作成中…');
  await dFlush();
  let ok=false,why='',asImg=false,base=1;
  try{
    const ab=await dMakePdf();
    if(append){base=(S.numPages||0)+1;ok=await appendItems([{bytes:ab,kind:'pdf',mime:'application/pdf'}]);}
    else ok=await openFile(new File([ab],`手書き図面_${stamp()}.pdf`,{type:'application/pdf'}),true);
  }catch(err){why=err.message;}
  if(!ok&&!append&&DRW.pages.length===1){
    try{const b=await dMakePng();ok=await openFile(new File([b],`手書き図面_${stamp()}.png`,{type:'image/png'}),true);asImg=ok;}
    catch(err){why=why||err.message;}
  }
  if(ok){
    const ns=dApplyScales(base,!asImg);
    dClose();setMode('write');
    toast((asImg?'手書き図面を取り込みました（この環境ではPDFでなく高解像度画像）。':append?`手書き図面をページ${base}〜として追加しました。`:'手書き図面をPDF化しました。')+(ns?'地図の縮尺は自動設定済みです。':'')+'「▶ 測定開始」で測定できます');
  }else toast('変換に失敗しました：'+(why||'不明なエラー'));
}

/* --- ページ・画像 --- */
function dSwitch(i){if(i<0||i>=DRW.pages.length)return;dStorePage();dLoadPage(i);dSave();}
function dPageAdd(){dStorePage();DRW.pages.push({paper:DRW.paper,items:[]});dLoadPage(DRW.pages.length-1);dSave();toast(`ページ${DRW.pages.length}を追加しました（階ごとに1ページ）`);}
function dPageDel(){
  if(DRW.pages.length<2)return toast('最後の1ページは削除できません（「全消去」を使ってください）');
  if(!confirm(`ページ${DRW.pi+1}を削除します。よろしいですか？`))return;
  DRW.pages.splice(DRW.pi,1);dLoadPage(Math.min(DRW.pi,DRW.pages.length-1));dSave();
}
const dNewId=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function dPlaceImage(el,src,gw){
  const id=dNewId();DRW.imgs[id]={src,el};
  const[PW,PH]=paperSz(),mg=10,sc=Math.min((PW-2*mg)/el.width,(PH-2*mg)/el.height),w=el.width*sc,h=el.height*sc,x=(PW-w)/2,y=(PH-h)/2;
  dSnap();const lead=DRW.items.filter(i=>i.t==='img').length;
  const it={t:'img',id,a:{x,y},b:{x:x+w,y:y+h},gw:gw||0};
  DRW.items.splice(lead,0,it);DRW.tool='sel';DRW.sel=[it];dDraw();dSync();dSave();
}
async function dAddImageFile(f){
  try{
    const url=URL.createObjectURL(f);
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('画像を読み込めません'));i.src=url;});
    const k=Math.min(1,4000/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
    c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    dPlaceImage(c,c.toDataURL('image/jpeg',.9),0);
    toast('画像を貼り付けました。ドラッグで移動、「画像＋／－」で大きさを調整できます');
  }catch(e){toast('画像を取り込めません：'+e.message);}
}
function dImgScale(f){
  const im=DRW.sel.filter(i=>i.t==='img');if(!im.length)return;dSnap();
  for(const it of im){const cx=(it.a.x+it.b.x)/2,cy=(it.a.y+it.b.y)/2,w=(it.b.x-it.a.x)*f/2,h=(it.b.y-it.a.y)*f/2;it.a={x:cx-w,y:cy-h};it.b={x:cx+w,y:cy+h};}
  dDraw();dSave();
}

/* --- Googleマップを別タブで開く → スクリーンショット → 貼付 --- */
function dOpenGMap(){
  const base='https://www.google.com/maps/@';
  const url=(lat,lng)=>`${base}${lat.toFixed(6)},${lng.toFixed(6)},19z/data=!3m1!1e3`;
  const w=window.open('about:blank','_blank');
  const go=u=>{if(w&&!w.closed)w.location.href=u;else location.href=u;};
  if(!navigator.geolocation){go(url(36.5592,139.8985));}
  else navigator.geolocation.getCurrentPosition(p=>go(url(p.coords.latitude,p.coords.longitude)),()=>go(url(36.5592,139.8985)),{enableHighAccuracy:true,timeout:6000,maximumAge:60000});
  toast('Googleマップを開きました。範囲を調整してスクリーンショット → コピー後、このアプリで「🖼 画像貼付」（またはCtrl+V）');
}

/* --- 開く・閉じる --- */
async function dOpen(){
  if(!S.siteId)return toast('現場が選択されていません');
  await flushSave();
  DRW.siteId=S.siteId;
  let d=null;try{d=await DB.get('dr:'+S.siteId);}catch(_){}
  DRW.imgs={};
  if(d&&Array.isArray(d.pages)&&d.pages.length)DRW.pages=d.pages.map(pg=>({paper:PAPERS[pg.paper]?pg.paper:'a3l',items:Array.isArray(pg.items)?pg.items:[]}));
  else if(d&&Array.isArray(d.items))DRW.pages=[{paper:PAPERS[d.paper]?d.paper:'a3l',items:d.items}];
  else DRW.pages=[{paper:'a3l',items:[]}];
  if(d&&d.imgs)for(const[id,src]of Object.entries(d.imgs)){const im=new Image();im.onload=()=>{if(DRW.open)dDraw();};im.src=src;DRW.imgs[id]={src,el:im};}
  DRW.open=true;DRW.cur=null;DRW.ptrs.clear();DRW.gest=null;
  $('#drw').hidden=false;$('#dAppend').style.display=S.bg?'':'none';
  dResize();dLoadPage(Math.min((d&&d.pi)||0,DRW.pages.length-1));
}
function dClose(){
  dFlush();DRW.open=false;DRW.cur=null;$('#drw').hidden=true;
  resize();
}
$('#bDraw').onclick=dOpen;
$('#dClose').onclick=dClose;
$('#dConv').onclick=()=>dConvert(false);
$('#dAppend').onclick=()=>dConvert(true);
$('#dPrev').onclick=()=>dSwitch(DRW.pi-1);$('#dNext').onclick=()=>dSwitch(DRW.pi+1);
$('#dPAdd').onclick=dPageAdd;$('#dPDel').onclick=dPageDel;
$('#dFile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)dAddImageFile(f);};
$('#dMap').onclick=dOpenGMap;
async function dPasteClip(){
  // コピー済みの画像があれば貼り付け。無い／読めない場合は画像ファイルの選択を開く
  try{
    if(navigator.clipboard&&navigator.clipboard.read){
      const its=await navigator.clipboard.read();
      for(const it of its){const t=it.types.find(x=>x.startsWith('image/'));if(t){const b=await it.getType(t);await dAddImageFile(new File([b],'clip.png',{type:t}));return;}}
    }
  }catch(_){}
  $('#dFile').click();
}
$('#dImg').onclick=dPasteClip;
$('#dIz').onclick=()=>dImgScale(1.1);$('#dIm').onclick=()=>dImgScale(1/1.1);
document.addEventListener('paste',e=>{
  if(!DRW.open)return;
  const its=(e.clipboardData&&e.clipboardData.items)||[];
  for(const it of its)if(it.type&&it.type.startsWith('image/')){const f=it.getAsFile();if(f){e.preventDefault();dAddImageFile(f);return;}}
});
dwrap.addEventListener('dragover',e=>e.preventDefault());
dwrap.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(f&&f.type.startsWith('image/')){e.preventDefault();dAddImageFile(f);}});
document.querySelectorAll('#dTools [data-t]').forEach(b=>b.onclick=()=>{DRW.tool=b.dataset.t;if(DRW.tool!=='sel')DRW.sel=[];dSync();dDraw();});
$('#dCols').onclick=e=>{const b=e.target.closest('.sw');if(!b)return;DRW.color=b.dataset.c;dSync();};
$('#dW').onchange=e=>{DRW.w=parseFloat(e.target.value)||0.5;};
$('#dSize').onchange=e=>{DRW.size=parseFloat(e.target.value)||8;};
$('#dDash').onclick=()=>{DRW.dash=!DRW.dash;dSync();};
$('#dAuto').onclick=()=>{DRW.auto=!DRW.auto;dSync();toast(DRW.auto?'自動直線：ON（手書きの線を直線・水平垂直に整えます）':'自動直線：OFF（そのまま手書きします）');};
$('#dGrid').onclick=()=>{DRW.grid=!DRW.grid;dSync();dDraw();};
$('#dFinger').onclick=()=>{S.finger=!S.finger;dSync();scheduleSave();toast(S.finger?'指でも描けます（2本指で拡大・移動）':'指は拡大・移動のみ（ペン・マウスで描きます）');};
$('#dPaper').onchange=e=>{if(PAPERS[e.target.value]){DRW.paper=e.target.value;dStorePage();dFit();dSave();}};
$('#dUndo').onclick=dUndo;$('#dRedo').onclick=dRedo;$('#dFit').onclick=dFit;
$('#dDelSel').onclick=dDelSel;
$('#dClear').onclick=()=>{
  if(!DRW.items.length)return;
  if(!confirm('このページの手書き内容をすべて消去します。\nよろしいですか？（「↶」で元に戻せます）'))return;
  dSnap();DRW.items=[];dChanged();
};
document.addEventListener('keydown',e=>{
  if(!DRW.open||$('#modal').classList.contains('show'))return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?dRedo():dUndo();}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();DRW.tool='sel';DRW.sel=[...DRW.items];dSync();dDraw();}
  else if((e.key==='Delete'||e.key==='Backspace')&&DRW.sel.length){e.preventDefault();dDelSel();}
  else if(e.key==='Escape'){if(DRW.cur)DRW.cur=null;DRW.sel=[];dSync();dDraw();}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&DRW.open)dFlush();});
new ResizeObserver(()=>{if(DRW.open)dResize();}).observe(dwrap);

/* ---------- 起動 ---------- */
(async()=>{
  syncBar();
  try{
    SITES=(await DB.get('sites'))||[];
    const st=await DB.get('settings');if(st)applySettings(st);
    if(!SITES.length){
      // 旧バージョン(現場管理なし)のデータがあれば現場として引き継ぐ
      const f=await DB.get('file'),d=await DB.get('data');
      const id=await createSite(f||d?'既存データ':'現場 1');
      if(f){await DB.set('sf:'+id,{bytes:f.bytes,kind:f.kind,mime:f.mime,fileName:f.fileName});await DB.del('file');}
      if(d){await DB.set('sd:'+id,{pageNo:d.pageNo||1,data:d.data});if(d.settings)applySettings(d.settings);await DB.del('data');}
    }
    let cur=await DB.get('cur');
    if(!siteMeta(cur))cur=[...SITES].sort((a,b)=>b.updated-a.updated)[0].id;
    await loadSite(cur);
  }catch(err){console.warn(err);toast('保存領域を利用できません（この環境では自動保存されません）');resize();refresh();}
})();
})();

/* ---- タブ切替（選んだタブは端末に記憶） ---- */
function tbSet(bar,t){
  const root=document.querySelector(`.tabs[data-bar="${bar}"]`).closest('.tb');
  root.querySelectorAll('.tab').forEach(b=>b.classList.toggle('cur',b.dataset.tab===t));
  root.querySelectorAll('.tbRow').forEach(r=>r.classList.toggle('cur',r.dataset.pane===t));
  try{localStorage.setItem('tb_'+bar,t);}catch(_){}
}
document.querySelectorAll('.tabs').forEach(tg=>{
  const bar=tg.dataset.bar;let t=null;try{t=localStorage.getItem('tb_'+bar);}catch(_){}
  if(!tg.querySelector(`[data-tab="${t}"]`))t=tg.querySelector('.tab').dataset.tab;
  tg.onclick=e=>{const b=e.target.closest('.tab');if(b)tbSet(bar,b.dataset.tab);};
  tbSet(bar,t);
});
