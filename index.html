<title>敷地レベル測定・高低差記録</title>
<style>
:root{--pri:#1565c0;--acc:#ef6c00;--line:#cfd4da;--bg:#eef0f3}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif;font-size:14px;color:#1c2127}
body{display:flex;flex-direction:column;background:var(--bg);overflow:hidden;-webkit-user-select:none;user-select:none}
#bar{display:flex;gap:6px;padding:6px 8px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;row-gap:5px;white-space:nowrap;align-items:center;flex:0 0 auto}
.grp{display:inline-flex;gap:3px;align-items:center;padding:0 4px;border-left:1px solid var(--line)}
button{font:inherit;border:1px solid #b9c0c8;background:#fff;border-radius:7px;padding:7px 10px;cursor:pointer;color:#1c2127}
button:active{background:#e3e8ee}
button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
button.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
button.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
button.dis{opacity:.45}
button.danger{background:#fff;color:#c62828;border-color:#c62828}
.sw{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid #fff;box-shadow:0 0 0 1px #888}
.sw.on{box-shadow:0 0 0 3px var(--pri)}
#main{flex:1;display:flex;min-height:0;position:relative}
#wrap{flex:1;position:relative;min-width:0;background:#dfe3e8}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:absolute;left:8px;top:8px;right:8px;pointer-events:none;display:flex}
#hud span{pointer-events:auto;background:rgba(21,101,192,.93);color:#fff;padding:7px 11px;border-radius:8px;font-size:13px;line-height:1.5;max-width:100%}
#hud button{padding:2px 8px;margin-left:6px;font-size:12px}
#panel{width:370px;background:#fff;border-left:1px solid var(--line);overflow:auto;flex:0 0 auto}
#panel.closed{display:none}
@media(max-width:900px){
 #panel{position:absolute;right:0;top:0;bottom:0;width:min(94vw,370px);box-shadow:-4px 0 14px rgba(0,0,0,.25);z-index:5}
}
#pbody{padding:8px}
#phead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:6px 8px;background:#fff;border-bottom:1px solid var(--line)}
#phead b{flex:1;font-size:14px}
#phead button{padding:6px 12px}
#pTab{position:absolute;right:8px;bottom:16px;z-index:6;padding:10px 14px;border-radius:22px;background:rgba(21,101,192,.95);color:#fff;border-color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);font-size:14px;touch-action:manipulation}
#pTab:active{background:#0d47a1}
.pbtns{margin-bottom:8px}
.pbtns button{width:100%}
.empty{color:#555;line-height:1.7;padding:6px}
.setup{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden}
.setup.act{border-color:var(--pri);box-shadow:0 0 0 2px rgba(21,101,192,.25)}
.sh{display:flex;align-items:center;gap:6px;padding:7px 8px;background:#f3f5f8;cursor:pointer}
.sh em{font-style:normal;background:var(--pri);color:#fff;border-radius:10px;padding:1px 8px;font-size:11px}
.sh .sp{flex:1}
.sh button{padding:3px 7px;font-size:12px}
.chip{width:14px;height:14px;border-radius:50%;display:inline-block}
.sinfo{padding:5px 9px;font-size:12px;color:#444;background:#fafbfc;border-bottom:1px solid var(--line);line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;color:#555;background:#fafbfc;padding:4px 3px;text-align:right;font-weight:600}
td{padding:5px 3px;text-align:right;border-top:1px solid #edf0f3;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:center}
tr[data-pt]{cursor:pointer}
tr.sel{background:#fff6c8}
.no{display:inline-block;min-width:24px;padding:1px 4px;border-radius:12px;color:#fff;font-weight:700;font-size:12px;text-align:center}
.pos{color:#1b5e20}.neg{color:#b71c1c}.big{font-weight:700;font-size:14px}
td button{padding:1px 6px;font-size:12px}
details.set{margin-top:6px;border:1px solid var(--line);border-radius:9px;padding:6px 9px}
details.set label{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}
details.set select,details.set input[type=range]{flex:1}

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const LP_MS=550, MOVE_TH=8, HOLD_MS=260;
const COLORS=['#1565c0','#2e7d32','#ef6c00','#6a1b9a','#00838f','#ad1457','#4e342e','#455a64'];
const PEN_COLORS=['#111111','#1565c0','#2e7d32','#d32f2f','#8e24aa'];

const S={
  siteId:null,siteName:'',
  fileName:'',kind:'',mime:'',bytes:null,pdfDoc:null,imgCanvas:null,pageNo:1,numPages:0,bg:null,W:0,H:0,
  points:[],strokes:[],setups:[],activeId:null,nextNo:1,nextId:1,
  datum:{k:null,g:null,f:null},base:'p1',
  mode:'write',pickRef:false,pen:{color:'#111111',w:2.5},
  unit:'mm',labelMode:'h',mk:1,mp:1,ol:1,wys:true,outList:'all',finger:false,
  view:{s:1,tx:0,ty:0},sel:null,setOpen:false,
  scales:{},refs:[],meas:[],snapOn:true,orthoAuto:true,tmp:null,hover:null,hi:null,rs:1,selA:null,cross:false
};
S.floors=[];S.wf=null;
let CALC={elev:{},hi:{},err:{}}, TAGS={};
const undoSt=[],redoSt=[];
let g=null, lp=null, renderTok=0;
const ptrs=new Map();
const cv=$('#cv'), wrap=$('#wrap');

/* ---------- 保存(IndexedDB) ---------- */
const DB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('site-level-sys',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
};
let saveTimer=null;
DB.del=function(k){return this.open().then(db=>new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSize=n=>n<1024?n+'B':n<1048576?Math.round(n/1024)+'KB':(n/1048576).toFixed(1)+'MB';
const fmtDate=t=>{const d=new Date(t||0);return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;};
const EMPTY_DATA=()=>({points:[],strokes:[],setups:[],activeId:null,nextNo:1,nextId:1,datum:{k:null,g:null,f:null},scales:{},refs:[],meas:[],floors:[],wf:null});

/* ---------- 現場管理 ---------- */
// 保存キー: sites=現場一覧(メタ) / cur=表示中の現場 / sd:<id>=測定データ / sf:<id>=図面ファイル / settings=表示設定
let SITES=[];
const siteMeta=id=>SITES.find(s=>s.id===id);
const saveSites=()=>DB.set('sites',SITES);
const newSiteId=()=>'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function scheduleSave(){if(!S.siteId)return;clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,500);}
async function flushSave(){
  clearTimeout(saveTimer);
  if(!S.siteId)return;
  const id=S.siteId;
  try{
    const sd={pageNo:S.pageNo,data:dataOf()};
    await DB.set('sd:'+id,sd);
    await DB.set('settings',settingsOf());
    const m=siteMeta(id);
    if(m){m.updated=Date.now();m.pts=allPts().length;m.strokes=S.strokes.length;m.setups=S.floors.reduce((a,f)=>a+(f.setups||[]).length,0);m.fileName=S.fileName;m.fileSize=S.bytes?S.bytes.byteLength:0;m.dataSize=JSON.stringify(sd).length;await saveSites();}
  }catch(e){console.warn(e);}
}
function updateSiteBtn(){$('#siteName').textContent=S.siteName||'—';}
function resetDoc(){
  S.hi=null;S.bytes=null;S.pdfDoc=null;S.imgCanvas=null;S.bg=null;S.W=0;S.H=0;S.fileName='';S.kind='';S.mime='';S.pageNo=1;S.numPages=0;
  restoreData(EMPTY_DATA());undoSt.length=0;redoSt.length=0;
}
async function createSite(name){
  const id=newSiteId();
  SITES.push({id,name,created:Date.now(),updated:Date.now(),fileName:'',fileSize:0,dataSize:0,pts:0,strokes:0,setups:0});
  await saveSites();return id;
}
async function loadSite(id){
  const m=siteMeta(id);if(!m)return;
  clearTimeout(saveTimer);resetDoc();S.siteId=null;
  let loadErr=null;
  try{
    const d=await DB.get('sd:'+id);
    const f=await DB.get('sf:'+id);
    if(d){restoreData(d.data||EMPTY_DATA());S.pageNo=d.pageNo||1;}
    if(f){
      S.bytes=f.bytes;S.kind=f.kind;S.mime=f.mime;S.fileName=f.fileName;
      try{if(S.kind==='pdf')await loadPdfDoc();else await loadImageCanvas();}
      catch(err){loadErr=err;S.pdfDoc=null;S.imgCanvas=null;}
    }

/* ---------- 計算 ---------- */
// 高さ = 視準高(HI) − 読み値。設置1: HI=基準点1の読み値(基準点1=±0)。設置n: HI=基準点の高さ+その点を覗いた読み値
function compute(){
  const elev={},hi={},err={};
  for(const s of S.setups){
    let H;
    if(s.idx===0){elev[s.refPointId]=0;H=s.refReading;}
    else{const e=elev[s.refPointId];if(e===undefined){err[s.id]='基準点の高さが未確定';continue;}H=e+s.refReading;}
    hi[s.id]=H;
    for(const p of S.points) if(p.setupId===s.id && p.id!==s.refPointId) elev[p.id]=H-p.reading;
  }
  return {elev,hi,err};
}
function calcTags(){const t={};S.setups.forEach(s=>{(t[s.refPointId]=t[s.refPointId]||[]).push('基準'+(s.idx+1));});return t;}
function fmtH(mm){
  if(mm==null||isNaN(mm))return '—';
  const u=S.unit,d=u==='mm'?1:u==='cm'?10:1000,dec=u==='m'?3:1;
  const t=Math.round(mm/d*Math.pow(10,dec))/Math.pow(10,dec);
  if(t===0)return '±0';
  return (t>0?'+':'-')+Math.abs(t).toFixed(dec).replace(/\.?0+$/,'');
}
const BASE_NAME={p1:'基準点1',kbm:'KBM',gl:'GL',fl:'FL'};
// 内部の高さ(基準点1=±0)を KBM/GL/FL 基準に換算するための補正量。必要な入力が足りなければ null
// k=最初の据付時の視準高(KBMより上が＋) / g=KBM→設計GL(GLがKBMより上が＋) / f=設計GL→FL(FLがGLより上が＋)
function baseOffset(b,D){
  D=D||S.datum;if(b==='p1')return 0;
  const s0=S.setups[0],H0=s0?CALC.hi[s0.id]:undefined;
  if(H0===undefined||D.k==null)return null;
  let o=H0-D.k;if(b==='kbm')return o;
  if(D.g==null)return null;o+=D.g;if(b==='gl')return o;
  if(D.f==null)return null;return o+D.f;
}
function heightIn(id,b,D){const e=CALC.elev[id];if(e===undefined)return null;const o=baseOffset(b,D);return o===null?null:e-o;}
const fmtR=v=>String(Math.round(v*100)/100);
const cls=v=>v>0?'pos':v<0?'neg':'';
const unitLabel=()=>S.unit;

/* ---------- 再描画 ---------- */
function refresh(){
  CALC=compute();TAGS=calcTags();
  renderPanel();updateHud();updatePager();syncBar();draw();scheduleSave();
}
function resize(){
  const r=wrap.getBoundingClientRect(),dpr=devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*dpr));cv.height=Math.max(1,Math.round(r.height*dpr));draw();scheduleHi();
}
function fitView(){
  const r=wrap.getBoundingClientRect();if(!S.W)return;
  const s=Math.min(r.width/S.W,r.height/S.H)*0.96;
  S.view={s,tx:(r.width-S.W*s)/2,ty:(r.height-S.H*s)/2};
}
const toPlan=(x,y)=>({x:(x-S.view.tx)/S.view.s,y:(y-S.view.ty)/S.view.s});
function zoomAt(x,y,f){
  const v=S.view,ns=Math.min(30,Math.max(0.05,v.s*f)),k=ns/v.s;
  v.tx=x-(x-v.tx)*k;v.ty=y-(y-v.ty)*k;v.s=ns;draw();scheduleHi();

function drawStroke(ctx,st){
  const a=st.pts;if(a.length<2)return;
  ctx.strokeStyle=st.color;ctx.lineWidth=st.w;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(a[0],a[1]);
  if(a.length<=4){ctx.lineTo(a[a.length-2],a[a.length-1]);}
  else{
    for(let i=2;i<a.length-2;i+=2){ctx.quadraticCurveTo(a[i],a[i+1],(a[i]+a[i+2])/2,(a[i+1]+a[i+3])/2);}

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
// PDF(A3)出力で図面1px分が占める、ラベル用スケール（PNG・画面のPDF同寸表示も同じ値を使う）
function kOut(){const land=S.W>=S.H,cw=land?2480:1754,ch=land?1754:2480,aw=cw-100,ah=ch-100-70,sc=Math.min(aw/S.W,ah/S.H);return (cw/1100)/sc;}
let OUT=false,WYSL=false; // OUT:出力描画中 / WYSL:画面でPDF同寸表示中
 // true: PDF/PNG/印刷の出力描画中
function drawMarker(ctx,p,x,y,k){
  const base=S.mk*k*((OUT||WYSL)?S.ol:1),mb=S.mp*k,r=10*mb;
  const isP1=S.setups[0]&&S.setups[0].refPointId===p.id;
  const st=S.setups.find(s=>s.id===p.setupId);
  const col=isP1?'#e53935':(st?st.color:'#555');
  const tags=TAGS[p.id]||[];
  if(S.sel===p.id){ctx.beginPath();ctx.arc(x,y,r+9*mb,0,Math.PI*2);ctx.fillStyle='rgba(255,214,0,.55)';ctx.fill();}
  if(tags.length){ctx.beginPath();ctx.arc(x,y,r+4.5*mb,0,Math.PI*2);ctx.strokeStyle=col;ctx.lineWidth=2.4*mb;ctx.stroke();}
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2*mb;ctx.stroke();
  ctx.fillStyle='#fff';ctx.font=`bold ${(p.no>99?8:11)*mb}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.no,x,y+0.5*mb);
  // ラベル
  const e=CALC.elev[p.id];
  const l1=S.base==='p1'?(isP1?'±0':fmtH(e)):BASE_NAME[S.base]+fmtH(heightIn(p.id,S.base));
  const parts=[];
  const later=S.setups.filter(z=>z.refPointId===p.id&&z.idx>0);
  if(later.length)parts.push('読 '+[p.reading,...later.map(z=>z.refReading)].map((v,i)=>`${i+1}回目 ${fmtR(v)}`).join(' / '));
  else if(S.labelMode==='hr')parts.push('読'+fmtR(p.reading));
  if(tags.length)parts.push(tags.join(' '));
  const l2=parts.join('  ');
  const f1=`bold ${16*base}px sans-serif`,f2=`${11*base}px sans-serif`;
  ctx.font=f1;const w1=ctx.measureText(l1).width;
  let w2=0;if(l2){ctx.font=f2;w2=ctx.measureText(l2).width;}
  const pad=5*base,bw=Math.max(w1,w2)+pad*2,bh=(l2?16*base+12*base+4*base:16*base+6*base);

  else if(dir==='l'){bx=x-r-gap-bw;by=y-bh/2;}
  else if(dir==='t'){bx=x-bw/2;by=y-r-gap-bh;}
  else{bx=x-bw/2;by=y+r+gap;}
  rr(ctx,bx,by,bw,bh,5*base);ctx.fillStyle='rgba(255,255,255,.9)';ctx.fill();ctx.strokeStyle=col;ctx.lineWidth=1.6*base;ctx.stroke();
  ctx.textAlign='left';ctx.textBaseline='top';ctx.fillStyle='#111';
  ctx.font=f1;ctx.fillText(l1,bx+pad,by+3*base);
  if(l2){ctx.font=f2;ctx.fillStyle='#444';ctx.fillText(l2,bx+pad,by+3*base+17*base);}
  // 測定場所メモ：高さ表示の真上に表示（高さ表示の位置・測点の移動にそのまま追従）
  let hx=bx,hy=by,hw=bw,hh=bh;

  return `↔ 距離測定（${st}）：${sc?(n?'② 2点目を押さえて離す':'① 1点目を押さえて離す（仮線の端点・交点・線上に吸着）／寸法の文字はドラッグで水平・垂直に移動'):'⚠ 先に「📏 縮尺」を設定してください'}${mv}`+(n?' <button id="hTmp">中止</button>':'');
}
const annoById=id=>S.refs.find(q=>q.id===id)||S.meas.find(q=>q.id===id);
function annoName(o){return S.meas.includes(o)?'距離':o.kind==='ext'?'延長線':o.kind==='perp'?'直交線':'仮線';}
function delAnno(){const o=annoById(S.selA);if(!o)return;snapshot();S.refs=S.refs.filter(q=>q.id!==o.id);S.meas=S.meas.filter(q=>q.id!==o.id);S.selA=null;refresh();}
function selectAt(x,y){
  const pl=toPlan(x,y),tol=22/S.view.s;let best=null,bd=tol;
  for(const r of pageRefs()){const sg=refSeg(r);if(!sg)continue;const d=distSegP(pl,sg[0],sg[1]);if(d<bd){bd=d;best=r;}}
  for(const q of S.meas){if(q.page!==S.pageNo)continue;const d=distSegP(pl,q.a,q.b);if(d<bd){bd=d;best=q;}}
  S.selA=best?best.id:null;updateHud();draw();
}
function setMode(m){

  if(m==='note')toast('✍ 注釈モード：手書きのみ（長押しで測点は入りません）');else if(prev==='note'&&m==='write')toast('📍 測点モード：ペンで長押しすると測点を入力できます');

// 2点目の水平・垂直補正：Shift＝常に固定 ／ タッチ・ペン＝ほぼ水平垂直なら自動で固定
function pickPt(sx,sy,opt){
  const q=snapAt(sx,sy),t=S.tmp;
  if(!t||t.pts.length!==1||!['scale','ext','line','meas'].includes(t.mode))return q;
  const A=t.pts[0],dx=q.x-A.x,dy=q.y-A.y;
  if(Math.hypot(dx,dy)<1e-6)return q;
  const horiz=Math.abs(dx)>=Math.abs(dy);
  const along=horiz?Math.abs(dx):Math.abs(dy),off=horiz?Math.abs(dy):Math.abs(dx);
  const near=Math.atan2(off,along)<0.087||off*S.view.s<8;
  const lock=opt&&(opt.shift||(opt.touch&&S.orthoAuto&&q.kind==='free'&&near));
  if(!lock)return q;
  return {x:horiz?q.x:A.x,y:horiz?A.y:q.y,kind:'ortho'};
}
async function onTap(x,y,opt){
  const m=S.mode;
  if(!MEAS.includes(m)||!S.bg)return;
  // 直交線の2手目：境界の仮線を選ぶ
  if(m==='perp'&&S.tmp&&S.tmp.mode==='perp'&&S.tmp.pts.length===1){
    const P=S.tmp.pts[0],pl=toPlan(x,y);
    if(!pageRefs().length){toast('先に境界の仮線を引いてください（┄仮線 / ┄延長線）');return;}
    const r=hitRef(pl,26,q=>distLineP(P,q.a,q.b)<1.5);
    if(!r){toast('境界の仮線の近くをタップしてください（始点が乗っている線は選べません）');return;}
    const len=Math.hypot(r.b.x-r.a.x,r.b.y-r.a.y);if(!len)return;
    const {t,F}=footOn(r,P);
    if(Math.hypot(F.x-P.x,F.y-P.y)<2){toast('始点が線上にあります');return;}
    snapshot();
    S.refs.push({id:nid(),page:S.pageNo,kind:'perp',ext:false,a:{x:P.x,y:P.y},b:F,dir:{x:(r.b.x-r.a.x)/len,y:(r.b.y-r.a.y)/len}});
    S.tmp=null;refresh();
    if(!inDom(r,t))toast('境界線の延長上に直交線を引きました');
    return;
  }
  if(m==='meas'&&!mmPerPx()){toast('先に「📏 縮尺」を設定してください');setMode('scale');return;}
  const q=pickPt(x,y,opt||{}),pt={x:q.x,y:q.y};
  if(!S.tmp||S.tmp.mode!==m){S.tmp={mode:m,pts:[pt]};S.hover=null;updateHud();draw();return;}
  const a=S.tmp.pts[0];
  if(Math.hypot(pt.x-a.x,pt.y-a.y)<2){toast('同じ位置です。別の点をタップしてください');return;}
  if(m==='scale'){
    S.tmp.pts.push(pt);draw();
    const dpx=Math.hypot(pt.x-a.x,pt.y-a.y);
    const cur=scaleOf();
    const r=await askDistance({dpx,value:cur?Math.round(cur.mm*10)/10:''});
    S.tmp=null;
    if(r){snapshot();S.scales[S.pageNo]={a:{x:a.x,y:a.y},b:pt,mm:r.mm};refresh();toast(`縮尺を設定しました（${fmtMM(r.mm)}）。次は仮線を引くか「↔ 距離」で測れます`);}
    else{updateHud();draw();}
    return;
  }
  if(m==='ext'||m==='line'){
    snapshot();S.refs.push({id:nid(),page:S.pageNo,kind:m==='ext'?'ext':'seg',ext:m==='ext',a:{x:a.x,y:a.y},b:pt});
    S.tmp=null;refresh();return;
  }
  if(m==='meas'){
    snapshot();S.meas.push({id:nid(),page:S.pageNo,a:{x:a.x,y:a.y},b:pt});
    S.tmp=null;refresh();
    const d=distMM(a,pt);toast(`距離 ${fmtMM(d)}（${fmtM(d)}）`);
  }
}

function renderScene(ctx,dpr,v,k,live){
  OUT=!live;WYSL=!!(live&&S.wys);
  if(WYSL)k=kOut()*v.s; // 画面でも、PDF出力と同じ大きさ（図面に対する比率）で表示
  ctx.save();
  ctx.setTransform(dpr*v.s,0,0,dpr*v.s,dpr*v.tx,dpr*v.ty);
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality=S.gesturing?'low':'high';
  ctx.fillStyle='#fff';ctx.fillRect(0,0,S.W,S.H);ctx.drawImage(S.bg,0,0);
  if(live&&S.hi&&S.hi.page===S.pageNo)ctx.drawImage(S.hi.c,S.hi.x0,S.hi.y0,S.hi.w,S.hi.h);
  for(const st of S.strokes) if(st.page===S.pageNo)drawStroke(ctx,st);
  if(live&&g&&g.stroke)drawStroke(ctx,g.stroke);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawAnno(ctx,v,k);
  for(const p of S.points) if(p.page===S.pageNo)drawLeader(ctx,p,v,k);
  curLive=!!live;if(live)PLB.length=0;
  for(const p of S.points) if(p.page===S.pageNo)drawMarker(ctx,p,p.x*v.s+v.tx,p.y*v.s+v.ty,k);
  curLive=false;
  ctx.restore();
}
function draw(){
  const ctx=cv.getContext('2d'),dpr=devicePixelRatio||1;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#dfe3e8';ctx.fillRect(0,0,cv.width,cv.height);
  if(!S.bg){
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#7a828c';ctx.font='18px sans-serif';ctx.textAlign='center';
    ctx.fillText('「図面を開く」からPDF配置図を読み込んでください',cv.width/dpr/2,cv.height/dpr/2-14);ctx.font='15px sans-serif';ctx.fillText('図面がない現場は「✏️ 手書き図面」で作図してPDF化できます',cv.width/dpr/2,cv.height/dpr/2+16);return;
  }
  renderScene(ctx,dpr,S.view,1,true);
  drawPreview(ctx,dpr);
  if(lp){
    const pr=Math.min(1,(performance.now()-lp.t0)/LP_MS);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.beginPath();ctx.arc(lp.x,lp.y,24,0,Math.PI*2);ctx.strokeStyle='rgba(229,57,53,.25)';ctx.lineWidth=5;ctx.stroke();
    ctx.beginPath();ctx.arc(lp.x,lp.y,24,-Math.PI/2,-Math.PI/2+Math.PI*2*pr);ctx.strokeStyle='#e53935';ctx.lineWidth=5;ctx.stroke();
  }
}

function startPinch(){
  const t=[...ptrs.values()].filter(q=>q.type==='touch');if(t.length<2)return;
  const cx=(t[0].x+t[1].x)/2,cy=(t[0].y+t[1].y)/2,d=Math.hypot(t[0].x-t[1].x,t[0].y-t[1].y)||1;
  g={kind:'pinch',d0:d,s0:S.view.s,wx:(cx-S.view.tx)/S.view.s,wy:(cy-S.view.ty)/S.view.s};
  S.gesturing=true;
}
function eraseAt(x,y){
  const pl=toPlan(x,y),r=14/S.view.s;let hit=false;
  const keep=S.strokes.filter(st=>{
    if(st.page!==S.pageNo)return true;
    const a=st.pts,rr2=r+st.w/2;
    for(let i=0;i<a.length;i+=2){if(Math.hypot(a[i]-pl.x,a[i+1]-pl.y)<rr2){hit=true;return false;}}
    return true;
  });
  // 仮点線・距離測定も消しゴムで消せる
  const kr=S.refs.filter(q=>{if(q.page!==S.pageNo)return true;const sg=refSeg(q);return !(sg&&distSegP(pl,sg[0],sg[1])<r);});
  const km=S.meas.filter(q=>q.page!==S.pageNo||!(distSegP(pl,q.a,q.b)<r));
  const hr=kr.length!==S.refs.length||km.length!==S.meas.length;
  if(hit||hr){
    if(g&&!g.snap){snapshot();g.snap=true;}
    S.strokes=keep;S.refs=kr;S.meas=km;draw();scheduleSave();if(hr)renderPanel();
  }
}
cv.addEventListener('pointerdown',e=>{
  if(!S.bg)return;e.preventDefault();
  const p=pos(e);
  if(e.pointerType==='touch'&&[...ptrs.values()].some(q=>q.type==='pen'))return;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  ptrs.set(e.pointerId,{id:e.pointerId,x:p.x,y:p.y,type:e.pointerType});
  if(e.pointerType==='pen'){for(const [id,q] of ptrs)if(q.type==='touch')ptrs.delete(id);abortG();}
  if([...ptrs.values()].filter(q=>q.type==='touch').length>=2){abortG();startPinch();return;}
  if(e.pointerType==='mouse'&&e.button!==0){g=mkPan(e.pointerId,p.x,p.y);return;}
  if((MEAS.includes(S.mode)||S.mode==='sel')&&!S.pickRef&&!(e.buttons&32)){
    if(!(S.tmp&&S.tmp.pts.length)){
      const lb=hitLabel(p.x,p.y);
      if(lb){S.selA=lb.m.id;updateHud();g={kind:'lbl',id:e.pointerId,m:lb.m,sx:p.x,sy:p.y,moved:false,a0:{...lb.m.a},b0:{...lb.m.b}};draw();return;}
    }
    if(S.mode==='sel'){g={kind:'pan',id:e.pointerId,lx:p.x,ly:p.y,sx:p.x,sy:p.y,moved:false,selTap:true};return;}
    const gg={kind:'pt',id:e.pointerId,sx:p.x,sy:p.y,touch:e.pointerType!=='mouse',shift:e.shiftKey,fired:false};
    g=gg;
    if(!gg.touch){gg.fired=true;S.cross=true;S.hover=pickPt(p.x,p.y,{shift:e.shiftKey,touch:false});draw();}
    else gg.timer=setTimeout(()=>{if(g!==gg)return;gg.fired=true;S.cross=true;if(navigator.vibrate)navigator.vibrate(20);S.hover=pickPt(gg.sx,gg.sy,{touch:true});draw();},HOLD_MS);
    return;}
  const drawing=(e.pointerType!=='touch'||S.finger)&&S.mode!=='hand';
  const erasing=S.mode==='erase'||(e.buttons&32);
  const hit=(S.mode==='write'||S.pickRef)&&!erasing?hitMarker(p.x,p.y):null;
  // 測点の上：タップで選択 → 選択中の測点はドラッグで移動 / 未選択なら手書き(指のみの場合は画面移動)
  if(hit){g={kind:'mk',id:e.pointerId,p:hit,sx:p.x,sy:p.y,moved:false,sel:hit.id===S.sel,panMode:!drawing};return;}
  // 高さ表示（ラベル）の長押し → 測定場所の文字入力（動かせば画面移動）
  if((S.mode==='write'||S.mode==='hand')&&!erasing&&!S.pickRef){
    const lp0=hitPtLabel(p.x,p.y);
    if(lp0){
      const gg=mkPan(e.pointerId,p.x,p.y);gg.fired=false;g=gg;lp={x:p.x,y:p.y,t0:performance.now()};tickLP();
      gg.timer=setTimeout(()=>{
        if(g!==gg||gg.moved)return;
        gg.fired=true;lp=null;if(navigator.vibrate)navigator.vibrate(30);draw();
        editNote(lp0);
      },LP_MS);
      return;
    }
  }
  if(!drawing){g=mkPan(e.pointerId,p.x,p.y);return;}
  if(erasing){g={kind:'erase',id:e.pointerId,snap:false};eraseAt(p.x,p.y);return;}
  if(S.mode==='note'){const pl0=toPlan(p.x,p.y);g={kind:'note',id:e.pointerId,stroke:{page:S.pageNo,color:S.pen.color,w:S.pen.w,pts:[pl0.x,pl0.y]}};return;}
  const gg={kind:'write',id:e.pointerId,sx:p.x,sy:p.y,moved:false,fired:false,stroke:null};
  g=gg;lp={x:p.x,y:p.y,t0:performance.now()};tickLP();
  gg.timer=setTimeout(()=>{
    if(g!==gg||gg.moved)return;
    gg.fired=true;lp=null;if(navigator.vibrate)navigator.vibrate(30);draw();
    if(S.pickRef){toast('基準にする【既存の測点】をタップしてください');return;}
    const pl=toPlan(gg.sx,gg.sy);addPoint(pl.x,pl.y);
  },LP_MS);
});
cv.addEventListener('pointermove',e=>{
  const q=ptrs.get(e.pointerId);if(!q||!g)return;
  const p=pos(e);q.x=p.x;q.y=p.y;
  if(g.kind==='pinch'){
    const t=[...ptrs.values()].filter(z=>z.type==='touch');if(t.length<2)return;
    const cx=(t[0].x+t[1].x)/2,cy=(t[0].y+t[1].y)/2,d=Math.hypot(t[0].x-t[1].x,t[0].y-t[1].y)||1;
    const ns=Math.min(30,Math.max(0.05,g.s0*Math.pow(d/g.d0,PINCH_GAIN)));
    S.view.s=ns;S.view.tx=cx-g.wx*ns;S.view.ty=cy-g.wy*ns;drawSoon();return;
  }
  if(g.id!==e.pointerId)return;
  if(g.kind==='pan'){
    if(!g.moved&&Math.hypot(p.x-g.sx,p.y-g.sy)>=MOVE_TH){g.moved=true;if(g.timer)lp=null;}
    S.view.tx+=p.x-g.lx;S.view.ty+=p.y-g.ly;g.lx=p.x;g.ly=p.y;drawSoon();
  }
  else if(g.kind==='erase'){eraseAt(p.x,p.y);}
  else if(g.kind==='mk'){
    if(!g.moved){
      if(Math.hypot(p.x-g.sx,p.y-g.sy)<MOVE_TH)return;
      if(S.pickRef)return;
      if(!g.sel){
        {const sx=g.sx,sy=g.sy;g=mkPan(e.pointerId,p.x,p.y);g.moved=true;S.view.tx+=p.x-sx;S.view.ty+=p.y-sy;draw();return;}
      }
      g.moved=true;snapshot();
    }
    const pl=toPlan(p.x,p.y);g.p.x=pl.x;g.p.y=pl.y;draw();
  }else if(g.kind==='lbl'){
    if(!g.moved){if(Math.hypot(p.x-g.sx,p.y-g.sy)<MOVE_TH)return;g.moved=true;snapshot();}
    const dx=(p.x-g.sx)/S.view.s,dy=(p.y-g.sy)/S.view.s,h=Math.abs(dx)>=Math.abs(dy),m=g.m,ox=h?dx:0,oy=h?0:dy;
    m.a={x:g.a0.x+ox,y:g.a0.y+oy};m.b={x:g.b0.x+ox,y:g.b0.y+oy};drawSoon();
  }else if(g.kind==='pt'){
    if(!g.fired){
      if(Math.hypot(p.x-g.sx,p.y-g.sy)<MOVE_TH)return;
      clearTimeout(g.timer);const sx=g.sx,sy=g.sy;g=mkPan(e.pointerId,p.x,p.y);g.moved=true;
      S.view.tx+=p.x-sx;S.view.ty+=p.y-sy;draw();return;
    }
    g.shift=e.shiftKey||g.shift;g.lx=p.x;g.ly=p.y;
    S.hover=pickPt(p.x,p.y,{shift:g.shift,touch:g.touch});drawSoon();
  }else if(g.kind==='note'){
    const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[],list=evs.length?evs:[e],a=g.stroke.pts,minD=0.6/S.view.s;
    for(const ev of list){const qq=pos(ev),pl=toPlan(qq.x,qq.y);if(Math.hypot(pl.x-a[a.length-2],pl.y-a[a.length-1])>=minD)a.push(pl.x,pl.y);}
    drawSoon();
  }else if(g.kind==='write'){
    // 押したまま動かしても手書きはせず、画面移動にする（長押しで測点追加）
    if(Math.hypot(p.x-g.sx,p.y-g.sy)<MOVE_TH)return;
    clearTimeout(g.timer);lp=null;
    const sx=g.sx,sy=g.sy;g=mkPan(e.pointerId,p.x,p.y);g.moved=true;
    S.view.tx+=p.x-sx;S.view.ty+=p.y-sy;draw();
  }
});
function endPtr(e){
  scheduleHi();
  ptrs.delete(e.pointerId);
  if(!g)return;
  if(g.kind==='pinch'){
    const t=[...ptrs.values()].filter(z=>z.type==='touch');
    if(t.length<2){S.gesturing=false;draw();g=t.length===1?{kind:'pan',id:t[0].id,lx:t[0].x,ly:t[0].y,sx:t[0].x,sy:t[0].y,moved:true}:null;}
    return;
  }
  if(g.id!==e.pointerId)return;
  clearTimeout(g.timer);lp=null;
  if(g.kind==='lbl'){const mv=g.moved;g=null;if(mv)refresh();else draw();return;}
  if(g.kind==='pt'){const gg=g;g=null;S.cross=false;S.hover=null;const px=gg.lx!==undefined?gg.lx:gg.sx,py=gg.ly!==undefined?gg.ly:gg.sy;if(e.type!=='pointercancel')onTap(px,py,{shift:gg.shift,touch:gg.touch});else draw();return;}
  if(g.kind==='pan'&&g.selTap&&!g.moved){const gg=g;g=null;selectAt(gg.sx,gg.sy);return;}
  if(g.kind==='note'){const gg=g;g=null;const a=gg.stroke.pts;if(a.length===2)a.push(a[0],a[1]);if(e.type!=='pointercancel'&&a.length>=4){snapshot();S.strokes.push(gg.stroke);refresh();}else draw();return;}
  if(g.kind==='write'&&g.stroke&&g.stroke.pts.length>=4){snapshot();S.strokes.push(g.stroke);g=null;refresh();return;}
  if(g.kind==='mk'){
    const gp=g.p,moved=g.moved,wasSel=g.sel;g=null;
    if(moved)refresh();
    else if(S.pickRef)startSetup(gp);
    else if(wasSel)editPoint(gp);
    else{S.sel=gp.id;refresh();toast(`測点${gp.no}を選択：ドラッグで移動／もう一度タップで編集`);}
    return;
  }
  if((g.kind==='pan'||g.kind==='write')&&!g.moved&&!g.fired&&S.sel!==null&&!S.pickRef){g=null;S.sel=null;refresh();return;}
  g=null;draw();
}
cv.addEventListener('pointerup',endPtr);
cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse'||!S.bg||!MEAS.includes(S.mode)||S.pickRef||e.buttons)return;
  const p=pos(e);S.lastMouse=p;S.hover=pickPt(p.x,p.y,{shift:e.shiftKey,touch:false});drawSoon();
});
['keydown','keyup'].forEach(n=>document.addEventListener(n,e=>{
  if(e.key!=='Shift'||!S.lastMouse||!S.bg||!MEAS.includes(S.mode)||S.pickRef)return;
  S.hover=pickPt(S.lastMouse.x,S.lastMouse.y,{shift:n==='keydown',touch:false});drawSoon();
}));
cv.addEventListener('pointerleave',()=>{S.lastMouse=null;if(S.hover){S.hover=null;drawSoon();}});
cv.addEventListener('wheel',e=>{e.preventDefault();if(!S.bg)return;const p=pos(e);zoomAt(p.x,p.y,Math.exp(-e.deltaY*(e.ctrlKey?0.02:0.0025)));},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));

/* ---------- 図面読込 ---------- */
async function loadPdfDoc(){
  if(!window.pdfjsLib)throw new Error('PDF.jsを読み込めません。インターネット接続を確認してください。');
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  S.pdfDoc=await pdfjsLib.getDocument({data:new Uint8Array(S.bytes.slice(0))}).promise;
  S.numPages=S.pdfDoc.numPages;
}
async function loadImageCanvas(){
  const blob=new Blob([S.bytes],{type:S.mime||'image/png'});
  const url=URL.createObjectURL(blob);
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
  const sc=Math.min(1,4000/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  S.imgCanvas=c;S.numPages=1;S.pdfDoc=null;
}
/* ---------- 高画質表示：拡大時は見えている範囲をPDFから高解像度で描き直す ---------- */
let hiTimer=null,hiTok=0,hiTask=null;
function scheduleHi(){clearTimeout(hiTimer);hiTimer=setTimeout(renderHi,200);}
async function renderHi(){
  if(S.kind!=='pdf'||!S.pdfDoc||!S.bg||!S.W)return;
  const dpr=devicePixelRatio||1,v=S.view,need=v.s*dpr;
  if(need<=1.05){if(S.hi){S.hi=null;draw();}return;}
  const r=wrap.getBoundingClientRect();
  const vx0=-v.tx/v.s,vy0=-v.ty/v.s,vx1=(r.width-v.tx)/v.s,vy1=(r.height-v.ty)/v.s;
  const h=S.hi;
  if(h&&h.page===S.pageNo&&h.k>=need*0.95&&vx0>=h.x0-1&&vy0>=h.y0-1&&vx1<=h.x0+h.w+1&&vy1<=h.y0+h.h+1)return;
  const mw=(vx1-vx0)*0.25,mh=(vy1-vy0)*0.25,MAXPX=14e6;
  let x0=Math.max(0,vx0-mw),y0=Math.max(0,vy0-mh),x1=Math.min(S.W,vx1+mw),y1=Math.min(S.H,vy1+mh);
  if(x1<=x0||y1<=y0)return;
  let k=need;
  if((x1-x0)*(y1-y0)*k*k>MAXPX){x0=Math.max(0,vx0);y0=Math.max(0,vy0);x1=Math.min(S.W,vx1);y1=Math.min(S.H,vy1);if(x1<=x0||y1<=y0)return;}
  if((x1-x0)*(y1-y0)*k*k>MAXPX)k=Math.sqrt(MAXPX/((x1-x0)*(y1-y0)));
  const tok=++hiTok,page=S.pageNo;
  if(hiTask){try{hiTask.cancel();}catch(_){}}
  try{
    const pg=await S.pdfDoc.getPage(page);
    if(tok!==hiTok)return;
    const vp=pg.getViewport({scale:S.rs*k});
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.ceil((x1-x0)*k));c.height=Math.max(1,Math.ceil((y1-y0)*k));
    const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);
    hiTask=pg.render({canvasContext:cx,viewport:vp,transform:[1,0,0,1,-x0*k,-y0*k]});
    await hiTask.promise;
    if(tok!==hiTok||page!==S.pageNo)return;
    S.hi={page,x0,y0,w:c.width/k,h:c.height/k,k,c};draw();
  }catch(err){/* 再描画で中断された場合など */}
}
async function showPage(n){
  const tok=++renderTok;S.hi=null;
  if(S.kind==='image'){S.bg=S.imgCanvas;}
  else{
    const page=await S.pdfDoc.getPage(n);
    const v1=page.getViewport({scale:1});
    const sc=Math.min(4000/Math.max(v1.width,v1.height),6);
    const vp=page.getViewport({scale:sc});S.rs=sc;
    const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);
    await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    if(tok!==renderTok)return;
    S.bg=c;
  }
  S.W=S.bg.width;S.H=S.bg.height;S.pageNo=n;activateFloor(n);S.tmp=null;S.hover=null;fitView();refresh();scheduleHi();
}
async function openFile(f,skipConfirm){
  if(!f)return false;
  if(!S.siteId){toast('現場が選択されていません');return false;}
  const hasData=allPts().length||S.strokes.length;
  const replacing=!!S.bg&&!!hasData;
  if(replacing&&!skipConfirm&&!confirm('この現場の図面を差し替えます。測点・手書きデータは消去されます。\nよろしいですか？\n（別の図面は「現場管理」で新しい現場を作ると別々に保存できます）'))return false;
  const old={bytes:S.bytes,kind:S.kind,mime:S.mime,fileName:S.fileName,pdfDoc:S.pdfDoc,imgCanvas:S.imgCanvas,numPages:S.numPages};
  try{
    S.bytes=await f.arrayBuffer();S.fileName=f.name;S.mime=f.type;
    S.kind=f.type.startsWith('image/')?'image':'pdf';
    if(S.kind==='pdf')await loadPdfDoc();else await loadImageCanvas();
    if(replacing){restoreData(EMPTY_DATA());undoSt.length=0;redoSt.length=0;}
    await DB.set('sf:'+S.siteId,{bytes:S.bytes,kind:S.kind,mime:S.mime,fileName:S.fileName});
    await showPage(Math.min(hasData&&!replacing?S.pageNo:1,S.numPages||1));
    toast(hasData&&!replacing?'図面を読み込み、保存済みの測点を復元しました':'図面を読み込みました。ペンで長押しして基準点1(±0)を設定します');
    return true;
  }catch(err){Object.assign(S,old);toast('図面を読み込めませんでした：'+err.message);if(!skipConfirm)alert('図面を読み込めませんでした：'+err.message);return false;}
}

/* ---------- 出力・保存 ---------- */
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
const stamp=()=>new Date().toISOString().slice(0,10);
const baseName=()=>(S.siteName||S.fileName||'site').replace(/[\\/:*?"<>|]/g,'_');
function exportCsv(){
  if(!allPts().length)return toast('測点がありません');
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['フロア','測点No','測定場所','設置','読み値(mm)','設置基準点との差(mm)','基準点1からの高さ(mm)','KBMからの高さ(mm)','GLからの高さ(mm)','FLからの高さ(mm)','測定位置X','測定位置Y','ページ']];
  eachFloor(f=>{
    for(const p of [...S.points].sort((a,b)=>a.no-b.no)){
      const s=S.setups.find(z=>z.id===p.setupId);if(!s)continue;
      const rel=p.id===s.refPointId?0:s.refReading-p.reading;
      rows.push([q(f.name),p.no,q(p.note),'設置'+(s.idx+1),p.reading,rel,CALC.elev[p.id]??'',heightIn(p.id,'kbm')??'',heightIn(p.id,'gl')??'',heightIn(p.id,'fl')??'',Math.round(p.ax),Math.round(p.ay),p.page]);
    }
  });
  const csv='\ufeff'+rows.map(r=>r.join(',')).join('\r\n');
  download(new Blob([csv],{type:'text/csv'}),`${baseName()}_高さ_${stamp()}.csv`);
}
function exportPng(){
  if(!S.bg)return;
  const c=document.createElement('canvas');c.width=S.W;c.height=S.H;
  renderScene(c.getContext('2d'),1,{s:1,tx:0,ty:0},kOut(),false);
  c.toBlob(b=>download(b,`${baseName()}_高さ記入_${stamp()}.png`));
}

/* ---------- PDF出力（A3） ---------- */
async function loadJsPdf(){
  if(window.jspdf)return;
  await new Promise((res,rej)=>{const t=document.createElement('script');t.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';t.onload=res;t.onerror=()=>rej(new Error('PDF出力ライブラリを読み込めません。通信環境を確認してください。'));document.head.appendChild(t);});
}
function pdfDrawPage(n){
  const land=S.W>=S.H,cw=land?2480:1754,ch=land?1754:2480,c=document.createElement('canvas');c.width=cw;c.height=ch;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);
  const m=50,hd=70,aw=cw-2*m,ah=ch-2*m-hd,sc=Math.min(aw/S.W,ah/S.H);
  const tx=m+(aw-S.W*sc)/2,ty=m+hd+(ah-S.H*sc)/2;
  x.fillStyle='#111';x.font='bold 38px sans-serif';x.textBaseline='top';x.textAlign='left';
  x.fillText(`${S.siteName||''}　測定図　${n}/${S.numPages||1}ページ　${stamp()}`,m,m);
  x.save();x.beginPath();x.rect(m,m+hd,aw,ah);x.clip();
  renderScene(x,1,{s:sc,tx,ty},cw/1100,false);
  x.restore();x.strokeStyle='#000';x.lineWidth=2;x.strokeRect(m,m+hd,aw,ah);
  return c;
}
function pdfTablePages(){
  if(!S.floors.length)return pdfTableOne('',true);
  const out=[];let first=true;
  eachFloor(f=>{out.push(...pdfTableOne(f.name,first));first=false;});
  return out;
}
function pdfTableOne(fname,withMeas){
  const pts=[...S.points].sort((a,b)=>a.no-b.no);if(!pts.length&&!(withMeas&&S.meas.length))return [];
  const u=unitLabel(),cols=['測点','測定場所','設置','読み値(mm)',`設置基準比(${u})`,`基準点1比(${u})`];if(S.base!=='p1')cols.push(`${BASE_NAME[S.base]}比(${u})`);
  const rows=pts.map(p=>{const s=S.setups.find(z=>z.id===p.setupId),rel=s&&p.id===s.refPointId?0:(s?s.refReading-p.reading:0);
    const r=[String(p.no),p.note||'','設置'+(s?s.idx+1:'?'),fmtR(p.reading),fmtH(rel),fmtH(CALC.elev[p.id])];if(S.base!=='p1')r.push(fmtH(heightIn(p.id,S.base)));return r;});
  if(withMeas)S.meas.forEach((q,i)=>{const d=distMM(q.a,q.b),r=['距離'+(i+1),q.page+'頁',fmtMM(d),fmtM(d),''];while(r.length<cols.length)r.push('');rows.push(r);});
  const cw=2480,ch=1754,m=50,hd=70,rh=64,per=Math.floor((ch-2*m-hd-rh)/rh),out=[];
  for(let o=0;o<rows.length;o+=per){
    const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);
    x.textBaseline='middle';x.fillStyle='#111';x.font='bold 38px sans-serif';x.textAlign='left';x.fillText(`${S.siteName||''}${fname?'　['+fname+']':''}　測点一覧（${BASE_NAME[S.base]}基準）`,m,m+30);
    const w=(cw-2*m)/cols.length;let y=m+hd;
    x.fillStyle='#e6eaf0';x.fillRect(m,y,cw-2*m,rh);x.fillStyle='#111';x.font='bold 32px sans-serif';x.textAlign='center';
    cols.forEach((t,i)=>x.fillText(t,m+w*i+w/2,y+rh/2));y+=rh;x.font='34px sans-serif';
    rows.slice(o,o+per).forEach(r=>{x.strokeStyle='#999';x.lineWidth=1;x.strokeRect(m,y,cw-2*m,rh);r.forEach((t,i)=>x.fillText(t,m+w*i+w/2,y+rh/2));y+=rh;});
    out.push(c);
  }
  return out;
}
// 出力用の各ページ（測定図＋測点一覧）をキャンバスで作る（PDF出力・印刷で共通）
async function buildOutCanvases(){
  const cur=S.pageNo,selS=S.sel,selA=S.selA,out=[];
  try{
    S.sel=null;S.selA=null;
    for(let n=1;n<=(S.numPages||1);n++){
      const has=allPts().some(p=>p.page===n)||S.refs.some(r=>r.page===n)||S.meas.some(q=>q.page===n)||S.strokes.some(t=>t.page===n);
      if(!has&&n!==cur)continue;
      if(S.pageNo!==n)await showPage(n);
      out.push(pdfDrawPage(n));
    }
    if(S.outList!=='drawing')out.push(...pdfTablePages());
  }finally{
    if(S.pageNo!==cur)await showPage(cur);
    S.sel=selS;S.selA=selA;refresh();
  }
  return out;
}
async function exportPdf(){
  if(!S.bg)return toast('図面がありません');
  toast('PDFを作成中…');
  try{
    await loadJsPdf();const {jsPDF}=window.jspdf;
    const cs=await buildOutCanvases();
    let doc=null;
    for(const c of cs){const o=c.width>=c.height?'l':'p';if(!doc)doc=new jsPDF({orientation:o,unit:'mm',format:'a3'});else doc.addPage('a3',o);doc.addImage(c.toDataURL('image/jpeg',.92),'JPEG',0,0,o==='l'?420:297,o==='l'?297:420);}
    doc.save(`${baseName()}_測定図_A3_${stamp()}.pdf`);toast('A3のPDFを出力しました');
  }catch(err){alert('PDF出力に失敗：'+err.message);}
}
// プリンター印刷：出力ページを用紙1枚ずつに収めて印刷ダイアログを開く
async function printOut(){
  if(!S.bg)return toast('図面がありません');
  toast('印刷用データを作成中…');
  try{
    const cs=await buildOutCanvases(),sz=$('#prSize').value==='A4'?'A4':'A3';
    const pages=cs.map(c=>`<div class="pg ${c.width>=c.height?'l':'p'}"><img src="${c.toDataURL('image/jpeg',.92)}"></div>`).join('');
    const html=`<!doctype html><html><head><meta charset="utf-8"><title>${esc(baseName())}_測定図</title><style>
@page land{size:${sz} landscape;margin:0}@page port{size:${sz} portrait;margin:0}
html,body{margin:0;padding:0;background:#fff}
.pg{box-sizing:border-box;break-after:page;page-break-after:always;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pg:last-child{break-after:auto;page-break-after:auto}
.pg.l{page:land;width:${sz==='A3'?'420mm':'297mm'};height:${sz==='A3'?'296mm':'209mm'}}
.pg.p{page:port;width:${sz==='A3'?'297mm':'210mm'};height:${sz==='A3'?'419mm':'296mm'}}
.pg img{max-width:100%;max-height:100%;object-fit:contain;display:block}
</style></head><body>${pages}</body></html>`;
    document.querySelectorAll('iframe.prFrame').forEach(f=>f.remove());
    const fr=document.createElement('iframe');fr.className='prFrame';
    fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
    document.body.appendChild(fr);
    const d=fr.contentWindow.document;d.open();d.write(html);d.close();
    const imgs=[...d.images];
    await Promise.all(imgs.map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r;})));
    fr.contentWindow.focus();
    setTimeout(()=>{try{fr.contentWindow.print();}catch(e){alert('印刷できませんでした：'+e.message);}},150);
    toast(`${sz}で印刷ダイアログを開きました（${cs.length}ページ）`);
  }catch(err){alert('印刷に失敗：'+err.message);}
}
const bufToB64=buf=>new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result.split(',')[1]);fr.readAsDataURL(new Blob([buf]));});
function b64ToBuf(b){const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;}
async function saveProject(){
  const o={app:'site-level-sys',v:1,siteName:S.siteName,fileName:S.fileName,kind:S.kind,mime:S.mime,pageNo:S.pageNo,data:dataOf(),settings:settingsOf()};
  if(S.bytes)o.file=await bufToB64(S.bytes);
  download(new Blob([JSON.stringify(o)],{type:'application/json'}),`${baseName()}_レベル記録_${stamp()}.json`);
  toast('保存しました（図面を含みます）');
}
async function loadProject(f){
  if(!f)return;
  try{
    const o=JSON.parse(await f.text());
    if(o.app!=='site-level-sys')throw new Error('このシステムの保存ファイルではありません');
    await flushSave();
    const nm=o.siteName||(o.fileName||'').replace(/\.[^.]+$/,'')||'読込現場';
    const id=await createSite(SITES.some(s=>s.name===nm)?nm+'（読込）':nm);
    if(o.file)await DB.set('sf:'+id,{bytes:b64ToBuf(o.file),kind:o.kind||'pdf',mime:o.mime||'',fileName:o.fileName||''});
    await DB.set('sd:'+id,{pageNo:o.pageNo||1,data:o.data||EMPTY_DATA()});
    applySettings(o.settings);
    await loadSite(id);
    toast(`現場「${S.siteName}」として読み込みました`);
  }catch(err){alert('読込に失敗：'+err.message);}
}

$('#hud').addEventListener('click',e=>{
  const id=e.target.id,p=S.sel!==null?pointById(S.sel):null;
  if(id==='hDelA'){delAnno();return;}
  if(id==='hDesA'){S.selA=null;updateHud();draw();return;}
  if(id==='hCancel'){S.pickRef=false;updateHud();}
  else if(id==='hTmp'){S.tmp=null;updateHud();draw();}

});

      <div class="sinfo">縮尺：${sc?`設定済み　<button data-act="clrScale" class="danger">解除</button>`:'<span class="neg">未設定</span>　バーの「📏 縮尺」で図面上の2点を押し、実寸を入力します'}<br>仮点線 ${refN}本${refN?'　<button data-act="clrRefs" class="danger">仮線を全消去</button>':''}</div>
      ${ms.length?`<table><thead><tr><th>No</th><th>距離</th><th>m</th><th></th></tr></thead><tbody>${rows}</tbody></table><div class="sinfo"><button data-act="clrMeas" class="danger">距離測定を全消去</button></div>`:'<div class="sinfo">距離測定はまだありません</div>'}

  const unit=unitLabel();

    const act=s.id===S.activeId,rp=pointById(s.refPointId);

    };

    <button data-act="clearAll" class="danger" style="width:100%">測点・手書きを全消去</button></details>`;
  el.innerHTML=h;
  const sel=(k,v)=>{const x=el.querySelector(`[data-set="${k}"]`);if(x){if(x.type==='checkbox')x.checked=v;else x.value=v;}};
  sel('unit',S.unit);sel('labelMode',S.labelMode);sel('mk',S.mk);sel('mp',S.mp);sel('ol',S.ol);sel('finger',S.finger);
  el.querySelectorAll('[data-val]').forEach(b=>b.textContent='×'+(+S[b.dataset.val]).toFixed(1));

$('#pbody').addEventListener('toggle',e=>{if(e.target.matches('details.set'))S.setOpen=e.target.open;},true);
$('#pbody').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');
  if(b){
    const a=b.dataset.act,id=+b.dataset.id;
    if(a==='newSetup')startPick();
    else if(a==='datum')openDatum();
    else if(a==='editPt'){const p=pointById(id);if(p){await focusPoint(id);editPoint(p);}}
    else if(a==='editSetup'){const s=S.setups.find(z=>z.id===id);if(s)editSetup(s);}
    else if(a==='delSetup')deleteLastSetup();
    else if(a==='delMeas'){snapshot();S.meas=S.meas.filter(q=>q.id!==id);refresh();}
    else if(a==='clrMeas'){if(confirm('このページの距離測定をすべて消去します。よろしいですか？')){snapshot();S.meas=S.meas.filter(q=>q.page!==S.pageNo);refresh();}}
    else if(a==='clrRefs'){if(confirm('このページの仮点線をすべて消去します。よろしいですか？')){snapshot();S.refs=S.refs.filter(q=>q.page!==S.pageNo);refresh();}}
    else if(a==='clrScale'){if(confirm('このページの縮尺設定を解除します。よろしいですか？')){snapshot();delete S.scales[S.pageNo];refresh();}}
    else if(a==='clearAll'){if(confirm('すべての測点・設置・手書きを消去します。よろしいですか？')){snapshot();S.points=[];S.strokes=[];S.setups=[];S.activeId=null;S.nextNo=1;S.sel=null;S.pickRef=false;refresh();}}
    return;
  }
  const ms=e.target.closest('tr[data-ms]');if(ms){const q=S.meas.find(z=>z.id===+ms.dataset.ms);if(q)focusXY((q.a.x+q.b.x)/2,(q.a.y+q.b.y)/2);return;}
  const tr=e.target.closest('tr[data-pt]');if(tr){focusPoint(+tr.dataset.pt);return;}
  const sh=e.target.closest('.setup');if(sh&&e.target.closest('.sh')){S.activeId=+sh.dataset.setup;S.pickRef=false;refresh();}
});

// 複数PDF・画像をページとして結合／追加
async function loadPdfLib(){
  if(window.PDFLib)return;
  await new Promise((res,rej)=>{const t=document.createElement('script');t.src='https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';t.onload=res;t.onerror=()=>rej(new Error('PDF結合ライブラリを読み込めません。通信環境を確認してください。'));document.head.appendChild(t);});
}
async function imgBytesToPng(it){
  const url=URL.createObjectURL(new Blob([it.bytes],{type:it.mime||'image/png'}));
  const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('画像を読み込めません'));i.src=url;});
  const k=Math.min(1,4000/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
  c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  const b=await new Promise(res=>c.toBlob(res,'image/png'));return new Uint8Array(await b.arrayBuffer());
}
async function docFromAny(items,base){
  await loadPdfLib();const{PDFDocument}=PDFLib;
  const dst=base?await PDFDocument.load(base,{ignoreEncryption:true}):await PDFDocument.create();
  for(const it of items){
    if(it.kind==='pdf'){const src=await PDFDocument.load(it.bytes,{ignoreEncryption:true});const pgs=await dst.copyPages(src,src.getPageIndices());pgs.forEach(q=>dst.addPage(q));}
    else{
      const png=await imgBytesToPng(it),img=await dst.embedPng(png),sc=Math.min(1190/Math.max(img.width,img.height),1),w=img.width*sc,h=img.height*sc;
      const pg=dst.addPage([w,h]);pg.drawImage(img,{x:0,y:0,width:w,height:h});
    }
  }
  return await dst.save();
}
const u8buf=u=>u.buffer.slice(u.byteOffset,u.byteOffset+u.byteLength);
const fileItem=async f=>({bytes:await f.arrayBuffer(),kind:f.type.startsWith('image/')?'image':'pdf',mime:f.type});
async function appendItems(items){
  if(!S.siteId){toast('現場が選択されていません');return false;}
  const old={bytes:S.bytes,kind:S.kind,mime:S.mime,fileName:S.fileName,pdfDoc:S.pdfDoc,imgCanvas:S.imgCanvas,numPages:S.numPages};
  try{
    const all=[];let base=null;
    if(S.bytes){if(S.kind==='pdf')base=S.bytes;else all.push({bytes:S.bytes,kind:'image',mime:S.mime});}
    all.push(...items);
    const u=await docFromAny(all,base),start=(S.bytes?S.numPages:0)+1;
    S.bytes=u8buf(u);S.kind='pdf';S.mime='application/pdf';
    S.fileName=(S.fileName?S.fileName.replace(/\.[^.]+$/,''):'図面')+'.pdf';
    await loadPdfDoc();S.imgCanvas=null;
    await DB.set('sf:'+S.siteId,{bytes:S.bytes,kind:S.kind,mime:S.mime,fileName:S.fileName});
    await showPage(start);
    toast(`ページを追加しました（全${S.numPages}ページ）。別の階は「▶ 測定開始」で新しい測定を始められます`);
    return true;
  }catch(err){Object.assign(S,old);toast('ページを追加できませんでした：'+err.message);return false;}
}
async function openFiles(files){
  files=files.filter(Boolean);if(!files.length)return;
  if(files.length===1)return openFile(files[0]);
  if(!S.siteId)return toast('現場が選択されていません');
  if(S.bg&&(allPts().length||S.strokes.length)&&!confirm('この現場の図面を、選んだ複数の図面（ページ順）に差し替えます。測点・手書きデータは消去されます。\nよろしいですか？\n（今の図面に追加したい場合は「➕ ページ追加」を使います）'))return;
  try{

    const items=await Promise.all(files.map(fileItem)),u=await docFromAny(items,null);
    await openFile(new File([u],`図面_${files.length}枚_${stamp()}.pdf`,{type:'application/pdf'}),true);
  }catch(err){toast('図面を結合できませんでした：'+err.message);}
}

/* ---------- 表示中のページを図面から削除（手書き図面で追加したページ等） ---------- */
async function deleteCurrentPage(){
  if(!S.bg||!S.siteId)return toast('先に図面を開いてください');
  if(S.kind!=='pdf'||(S.numPages||1)<2)return toast('最後の1ページは削除できません。図面ごと差し替える場合は「📂 図面を開く」、現場ごと消す場合は「現場管理」を使ってください');
  const n=S.pageNo,total=S.numPages;
  syncOut();
  const fl=S.floors.filter(f=>(f.pages||[]).includes(n));
  // 他ページと同じフロアで、このページに測点がある場合は、測定データの整合性のため削除させない
  const blocked=fl.find(f=>(f.pages||[]).length>1&&(f.points||[]).some(p=>p.page===n));
  if(blocked)return toast(`ページ${n}の測点が、他ページと共通のフロア「${blocked.name}」に含まれています。先にこのページの測点を消すか、フロア別の測定でフロアを整理してから削除してください`);
  const cnt={pt:fl.reduce((a,f)=>a+(f.points||[]).filter(p=>p.page===n).length,0),
    st:S.strokes.filter(t=>t.page===n).length,rf:S.refs.filter(r=>r.page===n).length,ms:S.meas.filter(q=>q.page===n).length};
  const info=[cnt.pt?`測点${cnt.pt}`:'',cnt.st?`手書き注釈${cnt.st}`:'',cnt.rf?`仮線${cnt.rf}`:'',cnt.ms?`距離${cnt.ms}`:'',S.scales[n]?'縮尺設定':''].filter(Boolean).join('・');
  if(!confirm(`ページ ${n} / 全${total}ページ を図面から削除します。\n`+(info?`このページの${info}も一緒に消えます。\n`:'')+(fl.length?`（このページだけのフロア「${fl.map(f=>f.name).join('」「')}」の測定データも消えます）\n`:'')+'この操作は元に戻せません。よろしいですか？'))return;
  try{
    toast('ページを削除中…');
    await flushSave();
    await loadPdfLib();
    const doc=await PDFLib.PDFDocument.load(S.bytes,{ignoreEncryption:true});
    doc.removePage(n-1);
    const u=await doc.save();
    // データ側：該当ページ分を消し、後ろのページ番号を1つ詰める
    const del=new Set(fl.map(f=>f.id));
    S.floors=S.floors.filter(f=>!del.has(f.id));
    if(del.has(S.wf))loadFloor(null);
    const sh=p=>p>n?p-1:p;
    for(const f of S.floors){
      f.pages=(f.pages||[]).filter(p=>p!==n).map(sh);
      for(const p of (f.points||[]))p.page=sh(p.page);
    }
    S.floors=S.floors.filter(f=>(f.pages||[]).length||(f.points||[]).length);
    if(S.wf!==null&&!S.floors.some(f=>f.id===S.wf))loadFloor(null);
    S.strokes=S.strokes.filter(t=>t.page!==n);S.strokes.forEach(t=>{t.page=sh(t.page);});
    S.refs=S.refs.filter(r=>r.page!==n);S.refs.forEach(r=>{r.page=sh(r.page);});
    S.meas=S.meas.filter(q=>q.page!==n);S.meas.forEach(q=>{q.page=sh(q.page);});
    const ns={};for(const[k,v]of Object.entries(S.scales||{})){const p=+k;if(p===n)continue;ns[sh(p)]=v;}S.scales=ns;
    S.sel=null;S.selA=null;S.tmp=null;S.hover=null;S.hi=null;
    undoSt.length=0;redoSt.length=0;
    S.bytes=u8buf(u);S.fileName=S.fileName||'図面.pdf';
    await loadPdfDoc();
    await DB.set('sf:'+S.siteId,{bytes:S.bytes,kind:S.kind,mime:S.mime,fileName:S.fileName});
    await showPage(Math.min(n,S.numPages));
    refresh();scheduleSave();
    toast(`ページ${n}を削除しました（全${S.numPages}ページ）`);
  }catch(err){toast('ページを削除できませんでした：'+err.message);}
}

/* ---------- 手書き作図 → PDF変換 ---------- */
// 図面がない現場用：用紙(mm)上に手書きし、ベクターPDFに変換して通常のPDF図面として読み込む
const DRW={open:false,siteId:null,paper:'a3l',tool:'pen',color:PEN_COLORS[0],w:0.5,dash:false,size:8,grid:true,auto:true,
  pages:[],pi:0,imgs:{},items:[],sel:[],undo:[],redo:[],view:{s:1,tx:0,ty:0},cur:null,ptrs:new Map(),gest:null,saveT:null};
const PAPERS={a3l:[420,297],a3p:[297,420],a4l:[297,210],a4p:[210,297]};
const DFONT='"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif';
const dcv=$('#dCv'),dwrap=$('#dWrap');
const paperSz=()=>PAPERS[DRW.paper]||PAPERS.a3l;
const mctx=document.createElement('canvas').getContext('2d');
const dTextW=it=>{mctx.font=`${it.size*10}px ${DFONT}`;return mctx.measureText(it.s).width/10;};
const dDashOf=it=>[Math.max(3,it.w*6),Math.max(1.6,it.w*3)];

$('#dCols').innerHTML=PEN_COLORS.map(c=>`<button class="sw" data-c="${c}" style="background:${c}" title="色"></button>`).join('');

const dPos=e=>{const r=dcv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
const dMM=p=>({x:(p.x-DRW.view.tx)/DRW.view.s,y:(p.y-DRW.view.ty)/DRW.view.s});

function dSync(){
  document.querySelectorAll('#dTools [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===DRW.tool));
  document.querySelectorAll('#dCols .sw').forEach(b=>b.classList.toggle('on',b.dataset.c===DRW.color));
  $('#dDash').classList.toggle('on',DRW.dash);$('#dAuto').classList.toggle('on',DRW.auto);$('#dGrid').classList.toggle('on',DRW.grid);$('#dFinger').classList.toggle('on',S.finger);
  $('#dW').value=String(DRW.w);$('#dSize').value=String(DRW.size);$('#dPaper').value=DRW.paper;
  $('#dHint').style.display=(DRW.items.length||DRW.pages.length>1)?'none':'block';
  $('#dDelSel').style.display=DRW.sel.length?'':'none';$('#dDelSel').textContent=`🗑 選択を削除（${DRW.sel.length}）`;
  $('#dImgG').style.display=DRW.sel.some(i=>i.t==='img')?'inline-flex':'none';
  $('#dPg').textContent=`${DRW.pi+1}/${DRW.pages.length}`;
  dcv.style.cursor=DRW.tool==='hand'?'grab':DRW.tool==='text'?'text':'crosshair';
}
function dResize(){
  const r=dwrap.getBoundingClientRect(),dpr=devicePixelRatio||1;
  dcv.width=Math.max(1,Math.round(r.width*dpr));dcv.height=Math.max(1,Math.round(r.height*dpr));dDraw();
}
function dFit(){
  const r=dwrap.getBoundingClientRect(),[PW,PH]=paperSz();
  const s=Math.max(0.1,Math.min((r.width-24)/PW,(r.height-24)/PH));
  DRW.view={s,tx:(r.width-PW*s)/2,ty:(r.height-PH*s)/2};dDraw();
}

/* --- 描画 --- */
function dPaint(ctx,it){
  if(it.t==='img'){const o=DRW.imgs[it.id];if(o&&o.el&&o.el.naturalWidth!==0&&o.el.complete!==false){try{ctx.drawImage(o.el,it.a.x,it.a.y,it.b.x-it.a.x,it.b.y-it.a.y);}catch(_){}}return;}
  ctx.strokeStyle=it.c;ctx.fillStyle=it.c;ctx.lineWidth=it.w||0.5;ctx.lineCap='round';ctx.lineJoin='round';
  if(it.t==='text'){
    ctx.setLineDash([]);ctx.font=`${it.size}px ${DFONT}`;ctx.textBaseline='alphabetic';ctx.textAlign='left';ctx.fillText(it.s,it.x,it.y);return;
  }
  ctx.setLineDash(it.d?dDashOf(it):[]);
  if(it.t==='pen'){
    const P=it.pts;
    if(P.length===1){ctx.setLineDash([]);ctx.beginPath();ctx.arc(P[0][0],P[0][1],it.w/2,0,Math.PI*2);ctx.fill();return;}
    ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length;i++)ctx.lineTo(P[i][0],P[i][1]);ctx.stroke();
  }else if(it.t==='line'){
    ctx.beginPath();ctx.moveTo(it.a.x,it.a.y);ctx.lineTo(it.b.x,it.b.y);ctx.stroke();
  }else if(it.t==='rect'){
    ctx.strokeRect(Math.min(it.a.x,it.b.x),Math.min(it.a.y,it.b.y),Math.abs(it.b.x-it.a.x),Math.abs(it.b.y-it.a.y));
  }
}
function dDraw(){
  const ctx=dcv.getContext('2d'),dpr=devicePixelRatio||1,v=DRW.view,[PW,PH]=paperSz();
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#cfd5dc';ctx.fillRect(0,0,dcv.width,dcv.height);
  ctx.setTransform(dpr*v.s,0,0,dpr*v.s,dpr*v.tx,dpr*v.ty);
  ctx.save();ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=10*dpr;ctx.shadowOffsetY=2*dpr;ctx.fillStyle='#fff';ctx.fillRect(0,0,PW,PH);ctx.restore();
  if(DRW.grid){
    const st=v.s*10>=7?10:50;ctx.lineWidth=1/v.s;
    for(let x=0;x<=PW+0.01;x+=st){ctx.strokeStyle=x%50===0?'#c3cbd6':'#e6eaf0';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,PH);ctx.stroke();}
    for(let y=0;y<=PH+0.01;y+=st){ctx.strokeStyle=y%50===0?'#c3cbd6':'#e6eaf0';ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(PW,y);ctx.stroke();}
  }
  ctx.save();ctx.beginPath();ctx.rect(0,0,PW,PH);ctx.clip();
  for(const it of DRW.items)dPaint(ctx,it);
  if(DRW.cur&&DRW.cur.t!=='erase'&&DRW.cur.t!=='sel'&&DRW.cur.t!=='mv')dPaint(ctx,DRW.cur);
  ctx.restore();
  // 選択中の図形と選択枠
  ctx.save();ctx.lineWidth=1.5/v.s;ctx.setLineDash([5/v.s,3/v.s]);ctx.strokeStyle='#ef6c00';
  for(const it of DRW.sel){const b=dBox(it),pd=1.2;ctx.strokeRect(b.x0-pd,b.y0-pd,b.x1-b.x0+pd*2,b.y1-b.y0+pd*2);}
  const c=DRW.cur;
  if(c&&c.t==='sel'){ctx.strokeStyle='#1565c0';ctx.fillStyle='rgba(21,101,192,.10)';const x=Math.min(c.a.x,c.b.x),y=Math.min(c.a.y,c.b.y),w=Math.abs(c.b.x-c.a.x),h=Math.abs(c.b.y-c.a.y);ctx.fillRect(x,y,w,h);ctx.strokeRect(x,y,w,h);}
  ctx.restore();
  ctx.strokeStyle='#9aa5b1';ctx.lineWidth=1/v.s;ctx.strokeRect(0,0,PW,PH);
